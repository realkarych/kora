[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "kora"
version = "0.1.0.dev0"
description = "A control plane for graphs of coding-agent sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "jsonschema==4.26.0",
    "pydantic==2.14.1",
    "referencing==0.37.0",
    "sqlalchemy[asyncio]==2.1.5",
    "structlog==26.1.0",
    "typer==0.27.3",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.scripts]
kora = "kora.__main__:main"
kora-runner = "kora.plugins.runtime.local.supervisor:main"

[project.entry-points."kora.provider"]
"artifact_storage.local" = "kora.plugins.storage.local:provider_metadata"
"artifact_type.agent_session" = "kora.plugins.artifact_type.agent_session:provider_metadata"
"artifact_type.command_result" = "kora.plugins.artifact_type.command_result:provider_metadata"
"artifact_type.vcs_ref" = "kora.plugins.artifact_type.vcs_ref:provider_metadata"
"policy.allow_deny" = "kora.plugins.policy.allow_deny:provider_metadata"
"secrets.env" = "kora.plugins.secrets.env:provider_metadata"
"vcs.git" = "kora.plugins.vcs.git:provider_metadata"

[project.urls]
Homepage = "https://github.com/realkarych/kora"
Repository = "https://github.com/realkarych/kora"
Issues = "https://github.com/realkarych/kora/issues"

[project.optional-dependencies]
postgres = [
    "asyncpg==0.32.0",
]
cel = [
    "common-expression-language==0.10.0",
]
conformance = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "referencing==0.37.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kora"]
artifacts = ["src/kora/api/static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/web",
    "/hatch_build.py",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/LICENSE",
    "/.python-version",
]
exclude = [
    "/src/kora/api/static",
    "/web/node_modules",
    "/web/.vite",
    "/web/.venv",
    "/web/dist",
    "/web/build",
]

[tool.uv]
no-build-package = [
    "asyncpg",
    "greenlet",
    "sqlalchemy",
    "markupsafe",
    "wrapt",
    "common-expression-language",
    "pydantic-core",
    "rpds-py",
]
constraint-dependencies = ["wcwidth==0.8.5"]

[tool.pyright]
include = ["src", "hatch_build.py", "tests", "scripts/ci"]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py311"
respect-gitignore = false
extend-exclude = [".claude"]
include = ["*.py", "*.pyi", "*.ipynb", "**/pyproject.toml", "**/ruff.toml", "**/.ruff.toml"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ANN",
    "S",
    "BLE",
    "PT",
    "PGH",
    "ERA",
    "T20",
    "TID",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"scripts/ci/secret_scan.py" = ["S603"]
"scripts/ci/editorial_scope.py" = ["S603"]
"scripts/ci/mutation_process.py" = ["S603"]
"hatch_build.py" = ["S603"]
"src/kora/executor/launcher.py" = ["S603"]
"src/kora/plugins/vcs/git/decoder.py" = ["S603"]
"src/kora/plugins/vcs/git/export.py" = ["S603"]
"src/kora/plugins/vcs/git/tree_build.py" = ["S603"]
"tests/**" = ["S101", "S603"]
"src/kora/__main__.py" = ["BLE001"]
"src/kora/observability/bootstrap.py" = ["BLE001"]
"src/kora/cel_eval/thread.py" = ["BLE001"]
"src/kora/observability/sink.py" = ["BLE001"]
"src/kora/runner/gate.py" = ["S606"]
"tests/support/warning_filters.py" = ["TID251"]
"tests/fixtures/provider_tooling/src/kora_tooling_fixture/adverse_outcomes.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.skip".msg = "AGENTS.md Testing: no skipped tests"
"pytest.xfail".msg = "AGENTS.md Testing: no expected failures"
"pytest.exit".msg = "AGENTS.md Testing: a test process reports its result"
"pytest.importorskip".msg = "AGENTS.md Testing: no skipped tests"
"pytest.mark.skip".msg = "AGENTS.md Testing: no skipped tests"
"pytest.mark.skipif".msg = "AGENTS.md Testing: no skipped tests"
"pytest.mark.xfail".msg = "AGENTS.md Testing: no expected failures"
"pytest.mark.filterwarnings".msg = "AGENTS.md Testing: warnings are errors"
"pytest.MonkeyPatch".msg = "AGENTS.md Testing: no mocks or patching"
"_pytest".msg = "AGENTS.md Testing: no pytest internals"
"unittest.SkipTest".msg = "AGENTS.md Testing: no skipped tests"
"unittest.case".msg = "AGENTS.md Testing: no skipped tests"
"unittest.skip".msg = "AGENTS.md Testing: no skipped tests"
"unittest.skipIf".msg = "AGENTS.md Testing: no skipped tests"
"unittest.skipUnless".msg = "AGENTS.md Testing: no skipped tests"
"unittest.expectedFailure".msg = "AGENTS.md Testing: no expected failures"
"unittest.mock".msg = "AGENTS.md Testing: no mocks"
"mock".msg = "AGENTS.md Testing: no mocks"
"pytest_mock".msg = "AGENTS.md Testing: no mocks"
"warnings.filterwarnings".msg = "AGENTS.md Testing: warnings are errors"
"warnings.simplefilter".msg = "AGENTS.md Testing: warnings are errors"
"warnings.catch_warnings".msg = "AGENTS.md Testing: warnings are errors"
"warnings.resetwarnings".msg = "AGENTS.md Testing: warnings are errors"
"warnings.filters".msg = "AGENTS.md Testing: warnings are errors"
"contextlib.suppress".msg = "AGENTS.md Code: fail fast, no blind suppression"
"os._exit".msg = "AGENTS.md Testing: a test process reports its result"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "-p",
    "kora.conformance.plugin",
    "-m",
    "not measurement and not host_fixture",
]
filterwarnings = ["error"]
empty_parameter_set_mark = "fail_at_collect"
markers = [
    "measurement: serial performance and resource-lifetime measurement",
    "kora_conformance: a protocol conformance case of kora.conformance",
    "host_fixture: needs paths from scripts/ci/prepare-local-runtime-fixtures.sh",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
build = [
    "editables==0.6",
    "hatchling==1.32.4",
    "setuptools==84.2.1",
]
dev = [
    "jsonschema==4.26.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruamel-yaml==0.19.1",
    "ruff==0.17.1",
    "testcontainers==4.15.0",
    "types-jsonschema==4.26.0.20261006",
]
mutation = [
    "cosmic-ray==8.7.0",
]
