name: Change
description: Any change to kora, code or documentation.
body:
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: >-
        In one paragraph of 1–3 short sentences, explain the intended effect on the project,
        who it affects and why it matters where relevant, including material limits.
        Use plain language understandable without the implementation or prior discussion.
        Do not discuss code or implementation, list files or symbols, report checks, or narrate the work here.
        For design, documentation or process changes, describe their actual effect without implying
        implemented runtime behavior or inventing benefits. Keep technical details and required
        acceptance and verification evidence in the fields below.
    validations:
      required: true
  - type: markdown
    attributes:
      value: >-
        Apply exactly one primary `type:*` label and any applicable supplemental labels
        according to [AGENTS.md](https://github.com/realkarych/kora/blob/master/AGENTS.md#labels).
        Agents must assign and verify the GitHub labels when creating or updating the issue.
        Labels do not approve an implementation plan.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing, for whom, and what happens if nothing is done.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What is true once this issue is closed.
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Affected
      description: Users, components and specifications; link the requirements, decision records and specifications involved instead of restating them.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification scope
      description: Directly and transitively affected components, causal edges and integration-boundary owners; planned fresh component/profile agents and named checks from kora-verify. Include applicable performance and memory/resource-lifetime workloads. Include observability impact, event/context ownership and logging evidence, or a concrete applicability reason. Collection, redaction, propagation, buffer or sink changes select correctness, security and performance reviews. Native review uses the same component/profile delegation; only actual scoped results count, and executable checks remain required. Descendants inherit scope, revision and permissions. For unimplemented checks, name the implementing issue or this issue, the activation trigger and expected evidence. Resolve this scope before posting the implementation plan; missing tools for existing checks are blockers, not pending implementation.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Limits the solution must respect, such as budgets, compatibility or rules from AGENTS.md. For status:deferred, state the reason for postponement and the concrete condition or stage that triggers revisiting the issue.
    validations:
      required: false
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: What is not yet decided and has to be settled in this issue. Use question for a concrete unanswered request for information or clarification, and remove it once answered.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable without asking a person, such as a named test passing, a command printing a given result, or an endpoint returning a given field.
    validations:
      required: true
