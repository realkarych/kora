name: CI recovery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-recovery-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  recover:
    name: Rerun a CI run that GitHub never executed
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.head_repository.id == github.event.workflow_run.repository.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Classify the run and rerun an infrastructure failure once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/ci_recovery.py
