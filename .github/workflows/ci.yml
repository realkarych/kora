name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Scaffold (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: 3.11.17
            databases: sqlite,postgresql
          - os: ubuntu-24.04
            python: 3.15.0
            databases: sqlite,postgresql
          - os: macos-15
            python: 3.11.17
            databases: sqlite
    defaults:
      run:
        shell: bash
    env:
      KORA_TEST_DATABASES: ${{ matrix.databases }}
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: web/package.json
          run_install: false
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.13.1
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: scaffold-${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
          KORA_BUILD_CONSTRAINT_DIR="$(mktemp -d)"
          uv export --locked --only-group build --no-emit-project \
            --format requirements.txt \
            --output-file "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" \
            --target "$KORA_BUILD_CONSTRAINT_DIR/backend" \
            --require-hashes \
            --requirements "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" --no-deps \
            --build-constraints "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-build-hashes \
            --editable .
          printf 'KORA_BUILD_CONSTRAINT_DIR=%s\n' "$KORA_BUILD_CONSTRAINT_DIR" >> "$GITHUB_ENV"
          pnpm --dir web install --frozen-lockfile
      - name: Check Python and frontend sources
        run: |
          uv lock --check
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check --ignore-noqa .
          uv run --no-sync pyright
          pnpm --dir web run typecheck
          pnpm --dir web run lint
          pnpm --dir web run build
      - name: Run tests
        id: ordinary_tests
        run: |
          KORA_ORDINARY_OUTPUT="$(mktemp -d "$RUNNER_TEMP/kora-ordinary.XXXXXX")"
          printf 'KORA_ORDINARY_OUTPUT=%s\n' "$KORA_ORDINARY_OUTPUT" >> "$GITHUB_ENV"
          first=(
            tests/conformance/test_conformance_cases_detect_broken_providers.py
            tests/conformance/test_lifetime_helper_phases.py
            tests/conformance/test_lifetime_measurement_cohorts.py
            tests/conformance/test_lifetime_parent_exit.py
            tests/conformance/test_lifetime_pending_helpers.py
            tests/conformance/test_lifetime_resume.py
            tests/conformance/test_lifetime_rpc_concurrency.py
            tests/conformance/test_lifetime_services.py
            tests/conformance/test_local_process_lifetime.py
            tests/conformance/test_parent_lifetime.py
            tests/conformance/test_recovered_process_lifetime.py
          )
          second=(tests/conformance)
          for path in "${first[@]}"; do
            second+=("--ignore=$path")
          done
          other=(tests --ignore=tests/conformance)
          uv run --no-sync pytest --collect-only -q -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-full" tests > "$KORA_ORDINARY_OUTPUT/full.collection"
          uv run --no-sync pytest --collect-only -q -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-first" "${first[@]}" > "$KORA_ORDINARY_OUTPUT/first.collection"
          uv run --no-sync pytest --collect-only -q -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-second" "${second[@]}" > "$KORA_ORDINARY_OUTPUT/second.collection"
          uv run --no-sync pytest --collect-only -q -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-other" "${other[@]}" > "$KORA_ORDINARY_OUTPUT/other.collection"
          uv run --no-sync python -m tests.support.ordinary_inventory "$KORA_ORDINARY_OUTPUT" > "$KORA_ORDINARY_OUTPUT/inventory.json"
          pids=()
          uv run --no-sync python -m tests.support.ordinary_pytest -q -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-first" --basetemp="$KORA_ORDINARY_OUTPUT/tmp-first" --junitxml="$KORA_ORDINARY_OUTPUT/first.xml" "${first[@]}" > "$KORA_ORDINARY_OUTPUT/first.log" 2>&1 &
          pids+=("$!")
          uv run --no-sync python -m tests.support.ordinary_pytest -q -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-second" --basetemp="$KORA_ORDINARY_OUTPUT/tmp-second" --junitxml="$KORA_ORDINARY_OUTPUT/second.xml" "${second[@]}" > "$KORA_ORDINARY_OUTPUT/second.log" 2>&1 &
          pids+=("$!")
          uv run --no-sync python -m tests.support.ordinary_pytest -q -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-other" --basetemp="$KORA_ORDINARY_OUTPUT/tmp-other" --junitxml="$KORA_ORDINARY_OUTPUT/other.xml" "${other[@]}" > "$KORA_ORDINARY_OUTPUT/other.log" 2>&1 &
          pids+=("$!")
          result=0
          for pid in "${pids[@]}"; do
            if wait "$pid"; then
              :
            else
              result=1
            fi
          done
          for name in full.collection first.collection second.collection other.collection inventory.json first.log second.log other.log first.xml second.xml other.xml; do
            test -f "$KORA_ORDINARY_OUTPUT/$name"
            test ! -L "$KORA_ORDINARY_OUTPUT/$name"
            test -s "$KORA_ORDINARY_OUTPUT/$name"
          done
          cat "$KORA_ORDINARY_OUTPUT/inventory.json" "$KORA_ORDINARY_OUTPUT/first.log" "$KORA_ORDINARY_OUTPUT/second.log" "$KORA_ORDINARY_OUTPUT/other.log"
          exit "$result"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: ordinary_upload
        if: ${{ always() }}
        with:
          name: ordinary-tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            ${{ env.KORA_ORDINARY_OUTPUT }}/full.collection
            ${{ env.KORA_ORDINARY_OUTPUT }}/first.collection
            ${{ env.KORA_ORDINARY_OUTPUT }}/second.collection
            ${{ env.KORA_ORDINARY_OUTPUT }}/other.collection
            ${{ env.KORA_ORDINARY_OUTPUT }}/inventory.json
            ${{ env.KORA_ORDINARY_OUTPUT }}/first.log
            ${{ env.KORA_ORDINARY_OUTPUT }}/second.log
            ${{ env.KORA_ORDINARY_OUTPUT }}/other.log
            ${{ env.KORA_ORDINARY_OUTPUT }}/first.xml
            ${{ env.KORA_ORDINARY_OUTPUT }}/second.xml
            ${{ env.KORA_ORDINARY_OUTPUT }}/other.xml
          if-no-files-found: error
      - name: Require complete ordinary tests and evidence
        id: required_ordinary
        if: ${{ always() }}
        env:
          ORDINARY_RESULT: ${{ steps.ordinary_tests.outcome }}
          ORDINARY_UPLOAD_RESULT: ${{ steps.ordinary_upload.outcome }}
        run: |
          test "$ORDINARY_RESULT" = success
          test "$ORDINARY_UPLOAD_RESULT" = success
      - name: Build isolated distributions offline
        run: |
          KORA_BUILD_OFFLINE=1 uv build --offline \
            --python "$PWD/.venv/bin/python" \
            --build-constraints "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-hashes --clear
      - name: Check the synced environment and unchanged dependency files
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml

  resource-measurements:
    name: Logging, metadata and provider measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.required_measurements.outputs.verified }}
      checkout_revision: ${{ steps.source_revision.outputs.checkout_revision }}
    defaults:
      run:
        shell: bash
    env:
      KORA_TEST_DATABASES: sqlite,postgresql
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: resource-measurements
      - name: Install locked dependencies
        id: dependencies
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
          KORA_BUILD_CONSTRAINT_DIR="$(mktemp -d)"
          uv export --locked --only-group build --no-emit-project \
            --format requirements.txt \
            --output-file "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" \
            --target "$KORA_BUILD_CONSTRAINT_DIR/backend" \
            --require-hashes \
            --requirements "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" --no-deps \
            --build-constraints "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-build-hashes \
            --editable .
          printf 'KORA_BUILD_CONSTRAINT_DIR=%s\n' "$KORA_BUILD_CONSTRAINT_DIR" >> "$GITHUB_ENV"
      - name: Record actual and requested source revisions
        id: source_revision
        env:
          KORA_WORKFLOW_REVISION: ${{ github.sha }}
          KORA_REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_CHECKOUT_REVISION="$(git rev-parse HEAD)"
          test "$KORA_CHECKOUT_REVISION" = "$KORA_WORKFLOW_REVISION"
          printf 'Actual checkout: %s\nRequested measurement revision: %s\n' "$KORA_CHECKOUT_REVISION" "$KORA_REQUESTED_REVISION"
          printf 'checkout_revision=%s\n' "$KORA_CHECKOUT_REVISION" >> "$GITHUB_OUTPUT"
      - name: Measure logging overhead and resource lifetime
        id: measurement
        env:
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_MEASUREMENT_OUTPUT=measurements/logging-overhead.json \
            uv run --no-sync pytest -q -p no:logging -m measurement tests/measurements/test_logging_overhead.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        id: logging_upload
        if: ${{ !cancelled() && steps.measurement.outcome != 'skipped' }}
        with:
          name: logging-overhead-measurement
          path: measurements/logging-overhead.json
          if-no-files-found: error
      - name: Measure metadata database lifetime
        id: database_measurement
        env:
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_MEASUREMENT_OUTPUT=measurements/metadata-database-lifetime.json \
            uv run --no-sync pytest -q -m measurement tests/measurements/test_metadata_database_lifetime.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        id: database_upload
        if: ${{ !cancelled() && steps.database_measurement.outcome != 'skipped' }}
        with:
          name: metadata-database-lifetime-measurement
          path: measurements/metadata-database-lifetime.json
          if-no-files-found: error
      - name: Measure provider loading cost
        id: provider_loading_measurement
        env:
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_MEASUREMENT_OUTPUT=measurements/provider-loading-cost.json \
            uv run --no-sync pytest -q -p no:logging -m measurement tests/measurements/test_provider_loading_cost.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        id: provider_upload
        if: ${{ !cancelled() && steps.provider_loading_measurement.outcome != 'skipped' }}
        with:
          name: provider-loading-cost-measurement
          path: measurements/provider-loading-cost.json
          if-no-files-found: error
      - name: Measure protocol model and secret registration cost
        id: protocol_models_measurement
        env:
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_MEASUREMENT_OUTPUT=measurements/protocol-models-cost.json \
            uv run --no-sync pytest -q -p no:logging -m measurement tests/measurements/test_protocol_models_cost.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        id: protocol_upload
        if: ${{ !cancelled() && steps.protocol_models_measurement.outcome != 'skipped' }}
        with:
          name: protocol-models-cost-measurement
          path: measurements/protocol-models-cost.json
          if-no-files-found: error
      - name: Prepare bounded full-disk mount
        id: full_disk_prepare
        run: |
          mkdir -m 700 measurements/conformance-full-disk
          KORA_FULL_DISK_MOUNT="$(mktemp -d "$RUNNER_TEMP/kora-full-disk.XXXXXX")"
          printf 'KORA_LIFETIME_FULL_DISK_ROOT=%s\n' "$KORA_FULL_DISK_MOUNT" >> "$GITHUB_ENV"
          sudo mount -t tmpfs -o "size=16m,uid=$(id -u),gid=$(id -g),mode=0700,nodev,nosuid" tmpfs "$KORA_FULL_DISK_MOUNT"
          findmnt -n --output SOURCE,FSTYPE,TARGET,OPTIONS --target "$KORA_FULL_DISK_MOUNT" > measurements/conformance-full-disk/mount.txt
      - name: Exercise full-disk admission and registration
        id: full_disk
        run: |
          uv run --no-sync pytest -q --junitxml=measurements/conformance-full-disk/tests.xml tests/conformance/lifetime_full_disk.py
      - name: Preserve full-disk private evidence
        id: full_disk_evidence
        if: ${{ always() && !cancelled() && steps.full_disk_prepare.outcome != 'skipped' }}
        env:
          FULL_DISK_PREPARE_OUTCOME: ${{ steps.full_disk_prepare.outcome }}
          KORA_LIFETIME_CHECKOUT_REVISION: ${{ steps.source_revision.outputs.checkout_revision }}
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$FULL_DISK_PREPARE_OUTCOME" = success
          printf 'Actual checkout: %s\nRequested measurement revision: %s\n' "$KORA_LIFETIME_CHECKOUT_REVISION" "$KORA_MEASUREMENT_REVISION" > measurements/conformance-full-disk/source-revision.txt
          uv run --no-sync python -m tests.measurements.lifetime_evidence full-disk "$KORA_LIFETIME_FULL_DISK_ROOT" "$PWD/measurements/conformance-full-disk"
      - name: Dispose captured full-disk mount
        id: full_disk_cleanup
        if: ${{ always() && !cancelled() && steps.full_disk_prepare.outcome != 'skipped' }}
        env:
          FULL_DISK_EVIDENCE_OUTCOME: ${{ steps.full_disk_evidence.outcome }}
        run: |
          test "$FULL_DISK_EVIDENCE_OUTCOME" = success
          test -n "$KORA_LIFETIME_FULL_DISK_ROOT"
          sudo umount "$KORA_LIFETIME_FULL_DISK_ROOT"
          rmdir "$KORA_LIFETIME_FULL_DISK_ROOT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: full_disk_upload
        if: ${{ always() && !cancelled() && steps.full_disk_prepare.outcome != 'skipped' }}
        with:
          name: conformance-full-disk-evidence
          path: measurements/conformance-full-disk
          if-no-files-found: error
      - name: Measure local conformance lifetime
        id: lifetime_measurement
        env:
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          KORA_LIFETIME_CHECKOUT_REVISION: ${{ steps.source_revision.outputs.checkout_revision }}
        run: |
          mkdir -m 700 measurements/conformance-lifetime
          printf 'Actual checkout: %s\nRequested measurement revision: %s\n' "$KORA_LIFETIME_CHECKOUT_REVISION" "$KORA_MEASUREMENT_REVISION" > measurements/conformance-lifetime/source-revision.txt
          KORA_MEASUREMENT_OUTPUT="$PWD/measurements/conformance-lifetime/report.json" \
            uv run --no-sync pytest -q -p no:logging -m measurement --junitxml=measurements/conformance-lifetime/tests.xml tests/measurements/test_conformance_lifetime.py
      - name: Preserve lifetime raw data and retained roots
        id: lifetime_evidence
        if: ${{ always() && !cancelled() && steps.lifetime_measurement.outcome != 'skipped' }}
        env:
          KORA_LIFETIME_MEASUREMENT_OUTCOME: ${{ steps.lifetime_measurement.outcome }}
        run: |
          uv run --no-sync python -m tests.measurements.lifetime_evidence cohorts "$PWD/measurements/conformance-lifetime" "$KORA_LIFETIME_MEASUREMENT_OUTCOME" /tmp
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: lifetime_upload
        if: ${{ always() && !cancelled() && steps.lifetime_measurement.outcome != 'skipped' }}
        with:
          name: conformance-lifetime-measurement
          path: measurements/conformance-lifetime
          include-hidden-files: true
          if-no-files-found: error
      - name: Check the synced environment and unchanged dependency files
        id: final_sync
        if: ${{ always() && !cancelled() }}
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml
      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require every producer step
        id: required_measurements
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_REVISION_OUTCOME: ${{ steps.source_revision.outcome }}
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
          LOGGING_UPLOAD_OUTCOME: ${{ steps.logging_upload.outcome }}
          DATABASE_MEASUREMENT_OUTCOME: ${{ steps.database_measurement.outcome }}
          DATABASE_UPLOAD_OUTCOME: ${{ steps.database_upload.outcome }}
          PROVIDER_LOADING_MEASUREMENT_OUTCOME: ${{ steps.provider_loading_measurement.outcome }}
          PROVIDER_UPLOAD_OUTCOME: ${{ steps.provider_upload.outcome }}
          PROTOCOL_MODELS_MEASUREMENT_OUTCOME: ${{ steps.protocol_models_measurement.outcome }}
          PROTOCOL_UPLOAD_OUTCOME: ${{ steps.protocol_upload.outcome }}
          FULL_DISK_PREPARE_OUTCOME: ${{ steps.full_disk_prepare.outcome }}
          FULL_DISK_OUTCOME: ${{ steps.full_disk.outcome }}
          FULL_DISK_EVIDENCE_OUTCOME: ${{ steps.full_disk_evidence.outcome }}
          FULL_DISK_CLEANUP_OUTCOME: ${{ steps.full_disk_cleanup.outcome }}
          FULL_DISK_UPLOAD_OUTCOME: ${{ steps.full_disk_upload.outcome }}
          LIFETIME_MEASUREMENT_OUTCOME: ${{ steps.lifetime_measurement.outcome }}
          LIFETIME_EVIDENCE_OUTCOME: ${{ steps.lifetime_evidence.outcome }}
          LIFETIME_UPLOAD_OUTCOME: ${{ steps.lifetime_upload.outcome }}
          FINAL_SYNC_OUTCOME: ${{ steps.final_sync.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: |
          test "$DEPENDENCIES_OUTCOME" = success
          test "$SOURCE_REVISION_OUTCOME" = success
          test "$MEASUREMENT_OUTCOME" = success
          test "$LOGGING_UPLOAD_OUTCOME" = success
          test "$DATABASE_MEASUREMENT_OUTCOME" = success
          test "$DATABASE_UPLOAD_OUTCOME" = success
          test "$PROVIDER_LOADING_MEASUREMENT_OUTCOME" = success
          test "$PROVIDER_UPLOAD_OUTCOME" = success
          test "$PROTOCOL_MODELS_MEASUREMENT_OUTCOME" = success
          test "$PROTOCOL_UPLOAD_OUTCOME" = success
          test "$FULL_DISK_PREPARE_OUTCOME" = success
          test "$FULL_DISK_OUTCOME" = success
          test "$FULL_DISK_EVIDENCE_OUTCOME" = success
          test "$FULL_DISK_CLEANUP_OUTCOME" = success
          test "$FULL_DISK_UPLOAD_OUTCOME" = success
          test "$LIFETIME_MEASUREMENT_OUTCOME" = success
          test "$LIFETIME_EVIDENCE_OUTCOME" = success
          test "$LIFETIME_UPLOAD_OUTCOME" = success
          test "$FINAL_SYNC_OUTCOME" = success
          test "$WORKFLOW_CANCELLED" = false
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

  pricing-measurements:
    name: Pricing database lifetime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.required_measurements.outputs.verified }}
      checkout_revision: ${{ steps.source_revision.outputs.checkout_revision }}
    defaults:
      run:
        shell: bash
    env:
      KORA_TEST_DATABASES: sqlite,postgresql
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.15.0
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: pricing-measurements
      - name: Install locked dependencies
        id: dependencies
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
          KORA_BUILD_CONSTRAINT_DIR="$(mktemp -d)"
          uv export --locked --only-group build --no-emit-project \
            --format requirements.txt \
            --output-file "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" \
            --target "$KORA_BUILD_CONSTRAINT_DIR/backend" \
            --require-hashes \
            --requirements "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" --no-deps \
            --build-constraints "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-build-hashes \
            --editable .
          printf 'KORA_BUILD_CONSTRAINT_DIR=%s\n' "$KORA_BUILD_CONSTRAINT_DIR" >> "$GITHUB_ENV"
      - name: Record actual and requested source revisions
        id: source_revision
        env:
          KORA_WORKFLOW_REVISION: ${{ github.sha }}
          KORA_REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_CHECKOUT_REVISION="$(git rev-parse HEAD)"
          test "$KORA_CHECKOUT_REVISION" = "$KORA_WORKFLOW_REVISION"
          printf 'Actual checkout: %s\nRequested measurement revision: %s\n' "$KORA_CHECKOUT_REVISION" "$KORA_REQUESTED_REVISION"
          printf 'checkout_revision=%s\n' "$KORA_CHECKOUT_REVISION" >> "$GITHUB_OUTPUT"
      - name: Provision isolated Python 3.11 pricing environment
        id: pricing_environment
        run: |
          KORA_PRICING_ROOT="$(mktemp -d "$RUNNER_TEMP/kora-pricing.XXXXXXXX")"
          printf 'KORA_PRICING_ROOT=%s\n' "$KORA_PRICING_ROOT" >> "$GITHUB_ENV"
          "$PWD/.venv/bin/python" -c 'import sys; assert sys.version_info[:3] == (3, 15, 0)'
          sha256sum .venv/pyvenv.cfg > "$KORA_PRICING_ROOT/original-environment.sha256"
          uv pip freeze --python "$PWD/.venv/bin/python" > "$KORA_PRICING_ROOT/original-packages.txt"
          sha256sum pyproject.toml uv.lock web/package.json web/pnpm-lock.yaml web/pnpm-workspace.yaml > "$KORA_PRICING_ROOT/dependencies.sha256"
          uv python install 3.11.17
          KORA_PRICING_BASE="$(uv python find --managed-python 3.11.17)"
          export UV_PROJECT_ENVIRONMENT="$KORA_PRICING_ROOT/environment"
          export UV_PYTHON="$KORA_PRICING_BASE"
          uv sync --python "$KORA_PRICING_BASE" --locked --no-build --group build --extra postgres --extra cel --no-install-project
          uv export --python "$KORA_PRICING_BASE" --locked --only-group build --no-emit-project \
            --format requirements.txt --output-file "$KORA_PRICING_ROOT/constraints.txt"
          uv pip install --python "$KORA_PRICING_ROOT/environment/bin/python" \
            --target "$KORA_PRICING_ROOT/backend" --require-hashes \
            --requirements "$KORA_PRICING_ROOT/constraints.txt"
          uv pip install --python "$KORA_PRICING_ROOT/environment/bin/python" --no-deps \
            --build-constraints "$KORA_PRICING_ROOT/constraints.txt" --require-build-hashes --editable .
          "$KORA_PRICING_ROOT/environment/bin/python" -c 'import sys; assert sys.version_info[:3] == (3, 11, 17)'
          sha256sum --check "$KORA_PRICING_ROOT/original-environment.sha256"
          uv pip freeze --python "$PWD/.venv/bin/python" > "$KORA_PRICING_ROOT/packages-after.txt"
          cmp "$KORA_PRICING_ROOT/original-packages.txt" "$KORA_PRICING_ROOT/packages-after.txt"
          "$PWD/.venv/bin/python" -c 'import sys; assert sys.version_info[:3] == (3, 15, 0)'
          sha256sum --check "$KORA_PRICING_ROOT/dependencies.sha256"
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml
      - name: Measure complete pricing database lifetime
        id: pricing_measurement
        env:
          KORA_TEST_DATABASES: sqlite,postgresql
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          KORA_PRICING_EVIDENCE: ${{ github.workspace }}/measurements/pricing-database-lifetime
        run: |
          "$KORA_PRICING_ROOT/environment/bin/python" -c \
            'import sys; from tests.measurements.pricing_lifetime_support import pricing_command; sys.exit(pricing_command())'
      - name: Verify pricing isolation
        id: pricing_isolation
        if: ${{ !cancelled() && steps.pricing_environment.outcome != 'skipped' }}
        run: |
          "$PWD/.venv/bin/python" -c 'import sys; assert sys.version_info[:3] == (3, 15, 0)'
          sha256sum --check "$KORA_PRICING_ROOT/original-environment.sha256"
          uv pip freeze --python "$PWD/.venv/bin/python" > "$KORA_PRICING_ROOT/packages-final.txt"
          cmp "$KORA_PRICING_ROOT/original-packages.txt" "$KORA_PRICING_ROOT/packages-final.txt"
          sha256sum --check "$KORA_PRICING_ROOT/dependencies.sha256"
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml
          printf 'KORA_PRICING_ISOLATION_VERIFIED=true\n' >> "$GITHUB_ENV"
      - name: Release pricing environment and retain lifecycle proof
        id: pricing_release
        if: ${{ always() && steps.pricing_environment.outcome != 'skipped' }}
        run: |
          "$PWD/.venv/bin/python" -c \
            'from tests.measurements.pricing_lifetime_support import pricing_environment_release; pricing_environment_release()'
      - name: Prepare bounded pricing publication
        id: pricing_publication
        if: ${{ !cancelled() && steps.pricing_environment.outcome != 'skipped' }}
        env:
          KORA_PRICING_MEASUREMENT_OUTCOME: ${{ steps.pricing_measurement.outcome }}
          KORA_PRICING_RELEASE_OUTCOME: ${{ steps.pricing_release.outcome }}
          KORA_PRICING_EVIDENCE: ${{ github.workspace }}/measurements/pricing-database-lifetime
        run: |
          "$PWD/.venv/bin/python" -c \
            'from tests.measurements.pricing_lifetime_support import pricing_publication_prepare; pricing_publication_prepare()'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: pricing_upload
        if: ${{ !cancelled() && steps.pricing_publication.outputs.ready == 'true' }}
        with:
          name: pricing-database-lifetime-measurement
          path: ${{ steps.pricing_publication.outputs.directory }}
          if-no-files-found: error
      - name: Release pricing publication
        id: pricing_publication_release
        if: ${{ always() && steps.pricing_publication.outputs.identity != '' }}
        env:
          KORA_PRICING_PUBLICATION: ${{ steps.pricing_publication.outputs.identity }}
        run: |
          "$PWD/.venv/bin/python" -c \
            'from tests.measurements.pricing_lifetime_support import pricing_publication_release; pricing_publication_release()'
      - name: Check the synced environment and unchanged dependency files
        id: final_sync
        if: ${{ always() && !cancelled() }}
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml
      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require every producer step
        id: required_measurements
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_REVISION_OUTCOME: ${{ steps.source_revision.outcome }}
          PRICING_ENVIRONMENT_OUTCOME: ${{ steps.pricing_environment.outcome }}
          PRICING_MEASUREMENT_OUTCOME: ${{ steps.pricing_measurement.outcome }}
          PRICING_ISOLATION_OUTCOME: ${{ steps.pricing_isolation.outcome }}
          PRICING_RELEASE_OUTCOME: ${{ steps.pricing_release.outcome }}
          PRICING_PUBLICATION_OUTCOME: ${{ steps.pricing_publication.outcome }}
          PRICING_UPLOAD_OUTCOME: ${{ steps.pricing_upload.outcome }}
          PRICING_PUBLICATION_RELEASE_OUTCOME: ${{ steps.pricing_publication_release.outcome }}
          FINAL_SYNC_OUTCOME: ${{ steps.final_sync.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: |
          test "$DEPENDENCIES_OUTCOME" = success
          test "$SOURCE_REVISION_OUTCOME" = success
          test "$PRICING_ENVIRONMENT_OUTCOME" = success
          test "$PRICING_MEASUREMENT_OUTCOME" = success
          test "$PRICING_ISOLATION_OUTCOME" = success
          test "$PRICING_RELEASE_OUTCOME" = success
          test "$PRICING_PUBLICATION_OUTCOME" = success
          test "$PRICING_UPLOAD_OUTCOME" = success
          test "$PRICING_PUBLICATION_RELEASE_OUTCOME" = success
          test "$FINAL_SYNC_OUTCOME" = success
          test "$WORKFLOW_CANCELLED" = false
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

  ir-measurements:
    name: IR model measurements (${{ matrix.run }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - run: 0
            pytest-arguments: >-
              tests/measurements/test_ir_models_cost.py '--deselect=tests/measurements/test_ir_models_cost.py::test_ir_configuration_repeated_lifetime[1]' '--deselect=tests/measurements/test_ir_models_cost.py::test_ir_configuration_repeated_lifetime[2]' '--deselect=tests/measurements/test_ir_models_cost.py::test_cost_checker_refuses_unexpected_acceptance' '--deselect=tests/measurements/test_ir_models_cost.py::test_cost_checker_refuses_unexpected_rejection' '--deselect=tests/measurements/test_ir_models_cost.py::test_cost_checker_releases_nested_values' '--deselect=tests/measurements/test_ir_models_cost.py::test_cost_process_failure_preserves_lossless_evidence' '--deselect=tests/measurements/test_ir_models_cost.py::test_accounting_value_cost' '--deselect=tests/measurements/test_ir_models_cost.py::test_accounting_value_lifetime'
          - run: 1
            pytest-arguments: >-
              'tests/measurements/test_ir_models_cost.py::test_ir_configuration_repeated_lifetime[1]' 'tests/measurements/test_ir_models_cost.py::test_cost_checker_refuses_unexpected_acceptance' 'tests/measurements/test_ir_models_cost.py::test_cost_checker_refuses_unexpected_rejection' 'tests/measurements/test_ir_models_cost.py::test_cost_checker_releases_nested_values' 'tests/measurements/test_ir_models_cost.py::test_cost_process_failure_preserves_lossless_evidence' 'tests/measurements/test_ir_models_cost.py::test_accounting_value_cost'
          - run: 2
            pytest-arguments: >-
              'tests/measurements/test_ir_models_cost.py::test_ir_configuration_repeated_lifetime[2]' 'tests/measurements/test_ir_models_cost.py::test_accounting_value_lifetime'
    env:
      KORA_TEST_DATABASES: sqlite
      KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      KORA_MEASUREMENT_OUTPUT: measurements/ir-models-cost-${{ matrix.run }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ir-measurements-${{ matrix.run }}
      - name: Install locked editable project for IR child processes
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
          KORA_IR_BUILD_CONSTRAINT_DIR="$(mktemp -d)"
          uv export --locked --only-group build --no-emit-project \
            --format requirements.txt \
            --output-file "$KORA_IR_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" --no-deps \
            --build-constraints "$KORA_IR_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-build-hashes \
            --editable .
      - name: Record actual IR checkout revision
        run: |
          mkdir -p measurements
          git rev-parse HEAD > measurements/ir-checkout-revision-${{ matrix.run }}.txt
          test "$(cat measurements/ir-checkout-revision-${{ matrix.run }}.txt)" = "$KORA_MEASUREMENT_REVISION"
      - name: Measure required IR shard
        id: measurement
        run: |
          uv run --no-sync pytest -q -p no:logging -m measurement ${{ matrix.pytest-arguments }} --junitxml=measurements/ir-models-cost-${{ matrix.run }}.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: ir_upload
        if: ${{ always() }}
        with:
          name: ir-models-cost-measurement-${{ env.KORA_MEASUREMENT_REVISION }}-${{ matrix.run }}
          path: measurements/
          if-no-files-found: error

  cel-producer:
    name: CEL lifetime and representative cost
    outputs:
      verified: ${{ steps.required_measurements.outputs.verified }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      KORA_TEST_DATABASES: sqlite
      KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      KORA_MEASUREMENT_OUTPUT: measurements/cel-evaluator-lifetime.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: cel-measurements
      - name: Install locked wheel dependencies
        id: dependencies
        run: uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
      - name: Record checked-out revision
        id: source_revision
        run: |
          mkdir -p measurements
          git rev-parse HEAD > measurements/cel-checkout-revision.txt
      - name: Measure evaluator lifetime and diagnostics
        id: measurement
        if: ${{ !cancelled() }}
        run: uv run --no-sync pytest -q -p no:logging -m measurement tests/measurements/test_cel_evaluator_lifetime.py
      - name: Check representative evaluation cost
        id: cost_regression
        if: ${{ !cancelled() }}
        env:
          KORA_CEL_COST_OUTPUT: measurements/cel-cost-smoke.json
        run: uv run --no-sync pytest -q -p no:logging -m measurement tests/measurements/test_cel_cost_regression.py
      - name: Check required CEL evidence files
        id: cel_artifacts
        if: ${{ always() && !cancelled() }}
        run: |
          test -s measurements/cel-evaluator-lifetime.json
          test -s measurements/cel-cost-smoke.json
          test "$(cat measurements/cel-checkout-revision.txt)" = "$KORA_MEASUREMENT_REVISION"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: cost_upload
        if: ${{ always() && steps.cost_regression.outcome != 'skipped' }}
        with:
          name: cel-cost-regression-measurement
          path: |
            measurements/cel-cost-smoke.json
            measurements/cel-checkout-revision.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: lifetime_upload
        if: ${{ always() && steps.measurement.outcome != 'skipped' }}
        with:
          name: cel-evaluator-lifetime-measurement
          path: |
            measurements/cel-evaluator-lifetime.json
            measurements/cel-checkout-revision.txt
          if-no-files-found: error
      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require every producer step
        id: required_measurements
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_REVISION_OUTCOME: ${{ steps.source_revision.outcome }}
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
          COST_REGRESSION_OUTCOME: ${{ steps.cost_regression.outcome }}
          CEL_ARTIFACTS_OUTCOME: ${{ steps.cel_artifacts.outcome }}
          COST_UPLOAD_OUTCOME: ${{ steps.cost_upload.outcome }}
          LIFETIME_UPLOAD_OUTCOME: ${{ steps.lifetime_upload.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: |
          test "$DEPENDENCIES_OUTCOME" = success
          test "$SOURCE_REVISION_OUTCOME" = success
          test "$MEASUREMENT_OUTCOME" = success
          test "$COST_REGRESSION_OUTCOME" = success
          test "$CEL_ARTIFACTS_OUTCOME" = success
          test "$COST_UPLOAD_OUTCOME" = success
          test "$LIFETIME_UPLOAD_OUTCOME" = success
          test "$WORKFLOW_CANCELLED" = false
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

  cel-measurements:
    name: CEL evaluator lifetime
    needs: [scaffold, ir-measurements, resource-measurements, pricing-measurements, cel-producer]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      KORA_TEST_DATABASES: sqlite
      KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: cel-measurements
      - name: Install locked wheel dependencies
        id: dependencies
        run: uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
      - name: Record checked-out revision
        id: source_revision
        run: |
          mkdir -p measurements
          git rev-parse HEAD > measurements/cel-checkout-revision.txt
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        id: ir_download
        if: ${{ always() && !cancelled() }}
        with:
          pattern: ir-models-cost-measurement-${{ env.KORA_MEASUREMENT_REVISION }}-*
          path: measurements/ir-shards
          merge-multiple: false
      - name: Verify exact IR test, action, gate and sample union
        id: ir_inventory
        if: ${{ always() && !cancelled() && steps.ir_download.outcome == 'success' }}
        run: |
          uv run --no-sync python -m tests.measurements.ir_measurement_evidence \
            measurements/ir-shards "$KORA_MEASUREMENT_REVISION" \
            > measurements/ir-shard-union.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: ir_union_upload
        if: ${{ always() && steps.ir_inventory.outcome != 'skipped' }}
        with:
          name: ir-models-cost-union-${{ env.KORA_MEASUREMENT_REVISION }}
          path: measurements/ir-shard-union.json
          if-no-files-found: error
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        id: cel_lifetime_download
        if: ${{ always() && !cancelled() }}
        with:
          name: cel-evaluator-lifetime-measurement
          path: measurements/cel-lifetime
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        id: cel_cost_download
        if: ${{ always() && !cancelled() }}
        with:
          name: cel-cost-regression-measurement
          path: measurements/cel-cost
      - name: Verify exact CEL evidence and both source receipts
        id: cel_inventory
        if: ${{ always() && !cancelled() && steps.cel_lifetime_download.outcome == 'success' && steps.cel_cost_download.outcome == 'success' }}
        run: |
          test -d measurements/cel-lifetime
          test ! -L measurements/cel-lifetime
          test -d measurements/cel-cost
          test ! -L measurements/cel-cost
          test "$(find measurements/cel-lifetime -mindepth 1 -print | LC_ALL=C sort)" = "$(printf '%s\n' measurements/cel-lifetime/cel-checkout-revision.txt measurements/cel-lifetime/cel-evaluator-lifetime.json)"
          test "$(find measurements/cel-cost -mindepth 1 -print | LC_ALL=C sort)" = "$(printf '%s\n' measurements/cel-cost/cel-checkout-revision.txt measurements/cel-cost/cel-cost-smoke.json)"
          for path in measurements/cel-lifetime/cel-evaluator-lifetime.json measurements/cel-cost/cel-cost-smoke.json; do
            test -f "$path"
            test ! -L "$path"
            test -s "$path"
          done
          for path in measurements/cel-lifetime/cel-checkout-revision.txt measurements/cel-cost/cel-checkout-revision.txt; do
            test -f "$path"
            test ! -L "$path"
            test "$(cat "$path")" = "$KORA_MEASUREMENT_REVISION"
          done
      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require every measurement and artifact
        id: required_measurements
        if: ${{ always() }}
        env:
          SCAFFOLD_RESULT: ${{ needs.scaffold.result }}
          IR_MATRIX_RESULT: ${{ needs.ir-measurements.result }}
          RESOURCE_RESULT: ${{ needs.resource-measurements.result }}
          RESOURCE_VERIFIED: ${{ needs.resource-measurements.outputs.verified }}
          PRICING_RESULT: ${{ needs.pricing-measurements.result }}
          PRICING_VERIFIED: ${{ needs.pricing-measurements.outputs.verified }}
          CEL_RESULT: ${{ needs.cel-producer.result }}
          CEL_VERIFIED: ${{ needs.cel-producer.outputs.verified }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_REVISION_OUTCOME: ${{ steps.source_revision.outcome }}
          IR_DOWNLOAD_OUTCOME: ${{ steps.ir_download.outcome }}
          IR_INVENTORY_OUTCOME: ${{ steps.ir_inventory.outcome }}
          IR_UNION_UPLOAD_OUTCOME: ${{ steps.ir_union_upload.outcome }}
          CEL_LIFETIME_DOWNLOAD_OUTCOME: ${{ steps.cel_lifetime_download.outcome }}
          CEL_COST_DOWNLOAD_OUTCOME: ${{ steps.cel_cost_download.outcome }}
          CEL_INVENTORY_OUTCOME: ${{ steps.cel_inventory.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: |
          test "$SCAFFOLD_RESULT" = success
          test "$IR_MATRIX_RESULT" = success
          test "$RESOURCE_RESULT" = success
          test "$PRICING_RESULT" = success
          test "$CEL_RESULT" = success
          test "$DEPENDENCIES_OUTCOME" = success
          test "$SOURCE_REVISION_OUTCOME" = success
          test "$IR_DOWNLOAD_OUTCOME" = success
          test "$IR_INVENTORY_OUTCOME" = success
          test "$IR_UNION_UPLOAD_OUTCOME" = success
          test "$CEL_LIFETIME_DOWNLOAD_OUTCOME" = success
          test "$CEL_COST_DOWNLOAD_OUTCOME" = success
          test "$CEL_INVENTORY_OUTCOME" = success
          test "$RESOURCE_VERIFIED" = true
          test "$PRICING_VERIFIED" = true
          test "$CEL_VERIFIED" = true
          test "$WORKFLOW_CANCELLED" = false

  browser:
    name: Console browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      KORA_BROWSER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: web/package.json
          run_install: false
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: Install pinned browser tools
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - name: Check and build browser sources
        run: |
          pnpm --dir web run typecheck
          pnpm --dir web run lint
          pnpm --dir web run build
      - name: Run browser checks
        run: pnpm --dir web run test:browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: console-browser-checks
          path: measurements/browser/
          if-no-files-found: error
          retention-days: 14

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: Lint repository Markdown
        shell: bash
        run: |
          set -euo pipefail
          KORA_DOC_FILES="$(mktemp)"
          git ls-files --cached --others --exclude-standard -z -- '*.md' > "$KORA_DOC_FILES"
          test -s "$KORA_DOC_FILES"
          xargs -0 npx --yes markdownlint-cli@0.45.0 -- < "$KORA_DOC_FILES"

  links:
    name: Links and anchors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Discover repository Markdown
        id: markdown-files
        shell: bash
        run: |
          set -euo pipefail
          KORA_DOC_FILES="$(mktemp)"
          git ls-files --cached --others --exclude-standard -z -- '*.md' > "$KORA_DOC_FILES"
          test -s "$KORA_DOC_FILES"
          args='--config lychee.toml --'
          while IFS= read -r -d '' file; do
            printf -v escaped '%q' "$file"
            args+=" $escaped"
          done < "$KORA_DOC_FILES"
          printf 'args=%s\n' "$args" >> "$GITHUB_OUTPUT"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: ${{ steps.markdown-files.outputs.args }}
          jobSummary: false
          output: ${{ runner.temp }}/lychee.md

  mermaid:
    name: Mermaid diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: Install diagram discovery tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Parse every Mermaid diagram
        shell: bash
        run: |
          set -euo pipefail
          KORA_DOC_FILES="$(mktemp)"
          git ls-files --cached --others --exclude-standard -z -- '*.md' > "$KORA_DOC_FILES"
          test -s "$KORA_DOC_FILES"
          KORA_MERMAID_FILES="$(mktemp)"
          xargs -0 rg --files-with-matches --null '^```mermaid' -- \
            < "$KORA_DOC_FILES" > "$KORA_MERMAID_FILES"
          test -s "$KORA_MERMAID_FILES"
          out="$(mktemp -d)"
          while IFS= read -r -d '' file; do
            echo "parsing $file"
            npx --yes @mermaid-js/mermaid-cli@12.0.0 --quiet \
              --puppeteerConfigFile .github/puppeteer-config.json \
              --input "$file" --output "$out/${file//\//_}" --artefacts "$out"
          done < "$KORA_MERMAID_FILES"

  ir-examples:
    name: Example graph documents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.13.1
          python-version: 3.11.17
          cache-suffix: ir-examples
      - run: uvx check-jsonschema@0.38.2 --schemafile knowledge/specs/ir.schema.json knowledge/specs/examples/*.ir.yaml
      - run: uvx check-jsonschema@0.38.2 --schemafile knowledge/specs/scenario.schema.json knowledge/specs/examples/scenarios/*/*.yaml

  github-templates:
    name: GitHub templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.13.1
          python-version: 3.11.17
          cache-suffix: github-templates
      - run: uvx check-jsonschema@0.38.2 --builtin-schema vendor.github-issue-forms .github/ISSUE_TEMPLATE/change.yml
      - run: uvx check-jsonschema@0.38.2 --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml
