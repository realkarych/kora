      - name: Verify exact CEL evidence and both source receipts
        id: cel_inventory
        if: ${{ needs.change-scope.outputs.full != 'false' && (always() && !cancelled() && steps.cel_lifetime_download.outcome == 'success' && steps.cel_cost_download.outcome == 'success') }}
        run: |
          test -d measurements/cel-lifetime
          test ! -L measurements/cel-lifetime
          test -d measurements/cel-cost
          test ! -L measurements/cel-cost
          test "$(find measurements/cel-lifetime -mindepth 1 -print | LC_ALL=C sort)" = "$(printf '%s\n' measurements/cel-lifetime/cel-checkout-revision.txt measurements/cel-lifetime/cel-evaluator-lifetime.json)"
          test "$(find measurements/cel-cost -mindepth 1 -print | LC_ALL=C sort)" = "$(printf '%s\n' measurements/cel-cost/cel-checkout-revision.txt measurements/cel-cost/cel-cost-smoke.json)"
          for path in measurements/cel-lifetime/cel-evaluator-lifetime.json measurements/cel-cost/cel-cost-smoke.json; do
            test -f "$path"
            test ! -L "$path"
            test -s "$path"
          done
          for path in measurements/cel-lifetime/cel-checkout-revision.txt measurements/cel-cost/cel-checkout-revision.txt; do
            test -f "$path"
            test ! -L "$path"
            test "$(cat "$path")" = "$KORA_MEASUREMENT_REVISION"
          done
      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ needs.change-scope.outputs.full != 'false' && (cancelled()) }}
        run: exit 0
      - name: Require every measurement and artifact
        id: required_measurements
        if: ${{ always() }}
        env:
          SCAFFOLD_RESULT: ${{ needs.scaffold-evidence.result }}
          SCAFFOLD_VERIFIED: ${{ needs.scaffold-evidence.outputs.verified }}
          IR_MATRIX_RESULT: ${{ needs.ir-measurements.result }}
          RESOURCE_RESULT: ${{ needs.resource-measurements.result }}
          RESOURCE_VERIFIED: ${{ needs.resource-measurements.outputs.verified }}
          PROVIDER_PROTOCOL_RESULT: ${{ needs.provider-protocol-measurements.result }}
          PROVIDER_PROTOCOL_VERIFIED: ${{ needs.provider-protocol-measurements.outputs.verified }}
          PRICING_RESULT: ${{ needs.pricing-measurements.result }}
          PRICING_VERIFIED: ${{ needs.pricing-measurements.outputs.verified }}
          CEL_RESULT: ${{ needs.cel-producer.result }}
          CEL_VERIFIED: ${{ needs.cel-producer.outputs.verified }}
          GIT_PUBLICATION_RESULT: ${{ needs.git-publication-measurements.result }}
          GIT_PUBLICATION_VERIFIED: ${{ needs.git-publication-measurements.outputs.verified }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_REVISION_OUTCOME: ${{ steps.source_revision.outcome }}
          IR_DOWNLOAD_OUTCOME: ${{ steps.ir_download.outcome }}
          IR_INVENTORY_OUTCOME: ${{ steps.ir_inventory.outcome }}
          IR_UNION_UPLOAD_OUTCOME: ${{ steps.ir_union_upload.outcome }}
          CEL_LIFETIME_DOWNLOAD_OUTCOME: ${{ steps.cel_lifetime_download.outcome }}
          CEL_COST_DOWNLOAD_OUTCOME: ${{ steps.cel_cost_download.outcome }}
          CEL_INVENTORY_OUTCOME: ${{ steps.cel_inventory.outcome }}
          WORKFLOW_CANCELLED: ${{ job.status == 'cancelled' || steps.workflow_cancellation.outcome != 'skipped' }}
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          SCOPE_VERIFIED: ${{ needs.change-scope.outputs.verified }}
          FULL_SCOPE: ${{ needs.change-scope.outputs.full }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$SCOPE_VERIFIED" = true
          test "$WORKFLOW_CANCELLED" = false
          if test "$FULL_SCOPE" = false; then
            test "$SCAFFOLD_RESULT" = success
            test "$SCAFFOLD_VERIFIED" = true
            test "$IR_MATRIX_RESULT" = skipped
            test "$RESOURCE_RESULT" = skipped
            test "$PROVIDER_PROTOCOL_RESULT" = skipped
            test "$PRICING_RESULT" = skipped
            test "$CEL_RESULT" = skipped
            test "$GIT_PUBLICATION_RESULT" = skipped
            exit 0
          fi
          test "$FULL_SCOPE" = true
          test "$SCAFFOLD_RESULT" = success
          test "$SCAFFOLD_VERIFIED" = true
          test "$IR_MATRIX_RESULT" = success
          test "$RESOURCE_RESULT" = success
          test "$PROVIDER_PROTOCOL_RESULT" = success
          test "$PRICING_RESULT" = success
          test "$CEL_RESULT" = success
          test "$GIT_PUBLICATION_RESULT" = success
          test "$DEPENDENCIES_OUTCOME" = success
          test "$SOURCE_REVISION_OUTCOME" = success
          test "$IR_DOWNLOAD_OUTCOME" = success
          test "$IR_INVENTORY_OUTCOME" = success
          test "$IR_UNION_UPLOAD_OUTCOME" = success
          test "$CEL_LIFETIME_DOWNLOAD_OUTCOME" = success
          test "$CEL_COST_DOWNLOAD_OUTCOME" = success
          test "$CEL_INVENTORY_OUTCOME" = success
          test "$RESOURCE_VERIFIED" = true
          test "$PROVIDER_PROTOCOL_VERIFIED" = true
          test "$PRICING_VERIFIED" = true
          test "$CEL_VERIFIED" = true
          test "$GIT_PUBLICATION_VERIFIED" = true
          test "$WORKFLOW_CANCELLED" = false


  browser:
    name: Console browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      KORA_BROWSER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: web/package.json
          run_install: false
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - name: Install pinned browser tools
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps --only-shell chromium
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - name: Check and build browser sources
        run: |
          pnpm --dir web run typecheck
          pnpm --dir web run lint
          pnpm --dir web run build
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - name: Run browser checks
        run: pnpm --dir web run test:browser
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        id: verification
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ needs.change-scope.outputs.full != 'false' && (always()) }}
        with:
          name: console-browser-checks
          path: measurements/browser/
          if-no-files-found: error
          retention-days: 14

      - name: Require browser verification or approved editorial scope
        if: ${{ always() }}
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          SCOPE_VERIFIED: ${{ needs.change-scope.outputs.verified }}
          FULL_SCOPE: ${{ needs.change-scope.outputs.full }}
          BROWSER_RESULT: ${{ steps.verification.outcome }}
          CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          test "$CANCELLED" = false
          test "$SCOPE_RESULT" = success
          test "$SCOPE_VERIFIED" = true
          if test "$FULL_SCOPE" = false; then
            test "$BROWSER_RESULT" = skipped
          else
            test "$FULL_SCOPE" = true
            test "$BROWSER_RESULT" = success
          fi
    needs:
      - change-scope
    if: ${{ always() }}

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: Lint repository Markdown
        shell: bash
        run: |
          set -euo pipefail
          KORA_DOC_FILES="$(mktemp)"
          git ls-files --cached --others --exclude-standard -z -- '*.md' > "$KORA_DOC_FILES"
          test -s "$KORA_DOC_FILES"
          xargs -0 npx --yes markdownlint-cli@0.45.0 -- < "$KORA_DOC_FILES"

  links:
    name: Links and anchors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Discover repository Markdown
        id: markdown-files
        shell: bash
        run: |
          set -euo pipefail
          KORA_DOC_FILES="$(mktemp)"
          git ls-files --cached --others --exclude-standard -z -- '*.md' > "$KORA_DOC_FILES"
          test -s "$KORA_DOC_FILES"
          args='--config lychee.toml --'
          while IFS= read -r -d '' file; do
            printf -v escaped '%q' "$file"
            args+=" $escaped"
          done < "$KORA_DOC_FILES"
          printf 'args=%s\n' "$args" >> "$GITHUB_OUTPUT"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: ${{ steps.markdown-files.outputs.args }}
          jobSummary: false
          output: ${{ runner.temp }}/lychee.md

  mermaid:
    name: Mermaid diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: Install diagram discovery tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Parse every Mermaid diagram
        shell: bash
        run: |
          set -euo pipefail
          KORA_DOC_FILES="$(mktemp)"
          git ls-files --cached --others --exclude-standard -z -- '*.md' > "$KORA_DOC_FILES"
          test -s "$KORA_DOC_FILES"
          KORA_MERMAID_FILES="$(mktemp)"
          xargs -0 rg --files-with-matches --null '^```mermaid' -- \
            < "$KORA_DOC_FILES" > "$KORA_MERMAID_FILES"
          test -s "$KORA_MERMAID_FILES"
          out="$(mktemp -d)"
          while IFS= read -r -d '' file; do
            echo "parsing $file"
            npx --yes @mermaid-js/mermaid-cli@12.0.0 --quiet \
              --puppeteerConfigFile .github/puppeteer-config.json \
              --input "$file" --output "$out/${file//\//_}" --artefacts "$out"
          done < "$KORA_MERMAID_FILES"

  ir-examples:
    name: Example graph documents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.13.1
          python-version: 3.11.17
          cache-suffix: ir-examples
      - name: Prepare source-owned IR schemas and independent corpus
        run: |
          uv sync --locked --no-build --no-install-project
          PYTHONPATH=src uv run --no-sync python -m tests.ir.schema_document_cases measurements/ir-schema-checker
          git rev-parse HEAD > measurements/ir-schema-checker-revision.txt
      - name: Check actual model modes, committed schema and independent corpus
        run: |
          uvx --python 3.11.17 --from check-jsonschema@0.38.2 --with pyright==1.1.414 python -c 'import subprocess, sys; subprocess.run([sys.executable, "-m", "pyright", "--pythonpath", sys.executable, ".github/check_ir_schema.py"], check=True)'
          uvx --python 3.11.17 --from check-jsonschema@0.38.2 --with pyright==1.1.414 python .github/check_ir_schema.py measurements/ir-schema-checker > measurements/ir-schema-checker-results.json
      - run: uvx check-jsonschema@0.38.2 --schemafile knowledge/specs/ir.schema.json knowledge/specs/examples/*.ir.yaml
      - run: uvx check-jsonschema@0.38.2 --schemafile knowledge/specs/scenario.schema.json knowledge/specs/examples/scenarios/*/*.yaml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: ir-schema-checker-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            measurements/ir-schema-checker/
            measurements/ir-schema-checker-results.json
            measurements/ir-schema-checker-revision.txt
          if-no-files-found: error

  github-templates:
    name: GitHub templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.13.1
          python-version: 3.11.17
          cache-suffix: github-templates
      - run: uvx check-jsonschema@0.38.2 --builtin-schema vendor.github-issue-forms .github/ISSUE_TEMPLATE/change.yml
      - run: uvx check-jsonschema@0.38.2 --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml

  mutation-tooling:
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: Mutation tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          cache-suffix: mutation-tooling-${{ matrix.os }}
      - run: uv sync --locked --group build --no-build --no-install-project
      - run: uv sync --locked --group mutation --group build --no-build-isolation
      - run: uv pip install --python .venv/bin/python --no-deps --no-build-isolation --editable .
      - run: uv run --no-sync python -B -m tests.tooling.native_probe
