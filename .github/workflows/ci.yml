name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-scope:
    name: Classify verification scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.full }}
      verified: ${{ steps.scope.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify with approved base instructions
        id: scope
        env:
          KORA_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          KORA_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          KORA_EVENT_NAME: ${{ github.event_name }}
        run: |
          KORA_SCOPE_PROGRAM="$(mktemp)"
          if test "$KORA_EVENT_NAME" = pull_request && git show "$KORA_BASE_REVISION:scripts/ci/editorial_scope.py" > "$KORA_SCOPE_PROGRAM"; then
            python3 "$KORA_SCOPE_PROGRAM"
          else
            printf 'full=true\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

  scaffold-plan:
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: Plan scaffold lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      lanes: ${{ steps.plan.outputs.lanes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-uv-python-3.11.17-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified uv and Python
        run: bash scripts/ci/setup_uv_cache.sh 3.11.17
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: scaffold-3.11.17-general
      - name: Install locked dependencies
        run: bash scripts/ci/scaffold_lane.sh dependencies
      - name: Plan general lanes from measured test durations
        id: plan
        run: bash scripts/ci/scaffold_lane.sh plan

  scaffold-tests:
    needs: [change-scope, scaffold-plan]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: Scaffold tests (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scaffold-plan.outputs.linux) }}
    defaults:
      run:
        shell: bash
    env:
      KORA_TEST_DATABASES: ${{ matrix.databases }}
      TESTCONTAINERS_RYUK_DISABLED: "true"
      KORA_SCAFFOLD_DIRECTORY: ${{ github.workspace }}/scaffold-evidence/scaffold-tests-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.lane }}
      KORA_SCAFFOLD_RUN: ${{ github.run_id }}
      KORA_SCAFFOLD_ATTEMPT: ${{ github.run_attempt }}
      KORA_WORKFLOW_REVISION: ${{ github.sha }}
      KORA_REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      KORA_PYTEST_ARGUMENTS: ${{ matrix.pytest-arguments }}
      KORA_SCAFFOLD_LANE: ${{ matrix.lane }}
      KORA_SCAFFOLD_LANES: ${{ matrix.lanes }}
      KORA_SCAFFOLD_OS: ${{ matrix.os }}
      KORA_SCAFFOLD_PYTHON: ${{ matrix.python }}
    steps:
      - name: Record lane job start
        run: printf 'KORA_LANE_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-node-uv-python-${{ matrix.python }}-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified Scaffold Node cache
        run: bash scripts/ci/setup_scaffold_node.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: web/package.json
          run_install: false
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: Prepare verified uv and Python
        env:
          KORA_UV_PYTHON: ${{ matrix.python }}
        run: bash scripts/ci/setup_uv_cache.sh "$KORA_UV_PYTHON"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.13.1
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: scaffold-${{ matrix.python }}-${{ startsWith(matrix.lane, 'general-') && 'general' || matrix.lane }}
      - name: Install locked dependencies
        id: dependencies
        run: bash scripts/ci/scaffold_lane.sh dependencies
      - name: Install locked frontend dependencies
        id: frontend_dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Check Python and frontend sources
        id: static_checks
        if: ${{ matrix.lane == 'static-checks' }}
        run: |
          uv lock --check
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check --ignore-noqa .
          uv run --no-sync pyright
          pnpm --dir web run typecheck
          pnpm --dir web run lint
          pnpm --dir web run build
      - name: Verify Linux unit collision ownership
        id: unit_collisions
        if: ${{ matrix.lane == 'local-runtime' && runner.os == 'Linux' }}
        run: |
          sudo bash scripts/ci/check-local-runtime-unit-collisions.sh root
          bash scripts/ci/check-local-runtime-unit-collisions.sh user
      - name: Prepare local runtime host fixtures
        id: preparation
        if: ${{ matrix.lane == 'local-runtime' }}
        run: |
          SECONDS=0
          sudo --preserve-env=RUNNER_TEMP scripts/ci/prepare-local-runtime-fixtures.sh prepare
          printf 'Host fixture preparation took %s s\n' "$SECONDS"
      - name: Collect and execute the exact test lane
        id: tests
        if: ${{ matrix.lane != 'static-checks' }}
        run: bash scripts/ci/scaffold_lane.sh tests
      - name: Preserve general lane evidence
        id: cohort_evidence
        if: ${{ always() && startsWith(matrix.lane, 'general-') }}
        run: bash scripts/ci/scaffold_lane.sh preserve
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: evidence_upload
        if: ${{ always() && matrix.lane != 'static-checks' }}
        with:
          name: scaffold-tests-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.lane }}
          path: ${{ env.KORA_SCAFFOLD_DIRECTORY }}
          if-no-files-found: error
      - name: Remove local runtime host fixtures
        id: teardown
        if: ${{ always() && matrix.lane == 'local-runtime' }}
        run: sudo scripts/ci/prepare-local-runtime-fixtures.sh teardown
      - name: Build isolated distributions offline
        id: distributions
        if: ${{ matrix.lane == 'local-runtime' }}
        run: |
          KORA_BUILD_OFFLINE=1 uv build --offline \
            --python "$PWD/.venv/bin/python" \
            --build-constraints "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-hashes --clear
      - name: Check the synced environment and unchanged dependency files
        id: final_sync
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml

      - name: Record lane workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require complete lane execution
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          PREPARATION_OUTCOME: ${{ steps.preparation.outcome }}
          TEARDOWN_OUTCOME: ${{ steps.teardown.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend_dependencies.outcome }}
          STATIC_OUTCOME: ${{ steps.static_checks.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          DISTRIBUTIONS_OUTCOME: ${{ steps.distributions.outcome }}
          FINAL_SYNC_OUTCOME: ${{ steps.final_sync.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: bash scripts/ci/require_outcomes.sh scaffold-lane

  scaffold-tests-macos:
    needs: [change-scope, scaffold-plan]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: Scaffold tests (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.scaffold-plan.outputs.macos) }}
    defaults:
      run:
        shell: bash
    env:
      KORA_TEST_DATABASES: ${{ matrix.databases }}
      TESTCONTAINERS_RYUK_DISABLED: "true"
      KORA_SCAFFOLD_DIRECTORY: ${{ github.workspace }}/scaffold-evidence/scaffold-tests-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.lane }}
      KORA_SCAFFOLD_RUN: ${{ github.run_id }}
      KORA_SCAFFOLD_ATTEMPT: ${{ github.run_attempt }}
      KORA_WORKFLOW_REVISION: ${{ github.sha }}
      KORA_REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      KORA_PYTEST_ARGUMENTS: ${{ matrix.pytest-arguments }}
      KORA_SCAFFOLD_LANE: ${{ matrix.lane }}
      KORA_SCAFFOLD_LANES: ${{ matrix.lanes }}
      KORA_SCAFFOLD_OS: ${{ matrix.os }}
      KORA_SCAFFOLD_PYTHON: ${{ matrix.python }}
    steps:
      - name: Record lane job start
        run: printf 'KORA_LANE_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-node-uv-python-${{ matrix.python }}-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified Scaffold Node cache
        run: bash scripts/ci/setup_scaffold_node.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: web/package.json
          run_install: false
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: Prepare verified uv and Python
        env:
          KORA_UV_PYTHON: ${{ matrix.python }}
        run: bash scripts/ci/setup_uv_cache.sh "$KORA_UV_PYTHON"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.13.1
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: scaffold-${{ matrix.python }}-${{ startsWith(matrix.lane, 'general-') && 'general' || matrix.lane }}
      - name: Install locked dependencies
        id: dependencies
        run: bash scripts/ci/scaffold_lane.sh dependencies
      - name: Install locked frontend dependencies
        id: frontend_dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Check Python and frontend sources
        id: static_checks
        if: ${{ matrix.lane == 'static-checks' }}
        run: |
          uv lock --check
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check --ignore-noqa .
          uv run --no-sync pyright
          pnpm --dir web run typecheck
          pnpm --dir web run lint
          pnpm --dir web run build
      - name: Prepare local runtime host fixtures
        id: preparation
        if: ${{ matrix.lane == 'local-runtime' }}
        run: |
          SECONDS=0
          sudo --preserve-env=RUNNER_TEMP scripts/ci/prepare-local-runtime-fixtures.sh prepare
          printf 'Host fixture preparation took %s s\n' "$SECONDS"
      - name: Collect and execute the exact test lane
        id: tests
        if: ${{ matrix.lane != 'static-checks' }}
        run: bash scripts/ci/scaffold_lane.sh tests
      - name: Preserve general lane evidence
        id: cohort_evidence
        if: ${{ always() && startsWith(matrix.lane, 'general-') }}
        run: bash scripts/ci/scaffold_lane.sh preserve
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: evidence_upload
        if: ${{ always() && matrix.lane != 'static-checks' }}
        with:
          name: scaffold-tests-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.lane }}
          path: ${{ env.KORA_SCAFFOLD_DIRECTORY }}
          if-no-files-found: error
      - name: Remove local runtime host fixtures
        id: teardown
        if: ${{ always() && matrix.lane == 'local-runtime' }}
        run: sudo scripts/ci/prepare-local-runtime-fixtures.sh teardown
      - name: Build isolated distributions offline
        id: distributions
        if: ${{ matrix.lane == 'local-runtime' }}
        run: |
          KORA_BUILD_OFFLINE=1 uv build --offline \
            --python "$PWD/.venv/bin/python" \
            --build-constraints "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-hashes --clear
      - name: Check the synced environment and unchanged dependency files
        id: final_sync
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml

      - name: Record lane workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require complete lane execution
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          PREPARATION_OUTCOME: ${{ steps.preparation.outcome }}
          TEARDOWN_OUTCOME: ${{ steps.teardown.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend_dependencies.outcome }}
          STATIC_OUTCOME: ${{ steps.static_checks.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          DISTRIBUTIONS_OUTCOME: ${{ steps.distributions.outcome }}
          FINAL_SYNC_OUTCOME: ${{ steps.final_sync.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: bash scripts/ci/require_outcomes.sh scaffold-lane

  changed-test-repetition:
    name: Changed test repetition
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      KORA_TEST_DATABASES: sqlite,postgresql
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-node-uv-python-3.11.17-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified Scaffold Node cache
        if: ${{ github.event_name == 'pull_request' }}
        run: bash scripts/ci/setup_scaffold_node.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          package_json_file: web/package.json
          run_install: false
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: Prepare verified uv and Python
        if: ${{ github.event_name == 'pull_request' }}
        run: bash scripts/ci/setup_uv_cache.sh 3.11.17
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: scaffold-3.11.17-general
      - name: Install locked dependencies
        if: ${{ github.event_name == 'pull_request' }}
        run: bash scripts/ci/scaffold_lane.sh dependencies
      - name: Install locked frontend dependencies
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm --dir web install --frozen-lockfile
      - name: Repeat changed test modules
        id: repetition
        if: ${{ github.event_name == 'pull_request' }}
        run: uv run --no-sync python -m tests.changed_test_repetition repeat

  scaffold-evidence:
    name: Scaffold evidence
    if: ${{ always() }}
    needs: [change-scope, scaffold-plan, scaffold-tests, scaffold-tests-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.completion.outputs.verified }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-uv-python-3.11.17-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified uv and Python
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        run: bash scripts/ci/setup_uv_cache.sh 3.11.17
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: scaffold-join
      - name: Install locked evidence dependencies
        id: dependencies
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        run: uv sync --locked --no-build --all-extras --no-install-project
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        id: evidence_download
        with:
          pattern: scaffold-tests-*
          path: scaffold-evidence
      - name: Report planned and recorded lane times
        if: ${{ !cancelled() && needs.change-scope.outputs.full != 'false' }}
        id: timings
        env:
          KORA_SCAFFOLD_LANES: ${{ needs.scaffold-plan.outputs.lanes }}
        run: |
          uv run --no-sync python -m tests.scaffold_evidence timings \
            scaffold-evidence "$KORA_SCAFFOLD_LANES"
      - name: Verify the planned lanes and complete collection coverage
        if: ${{ !cancelled() && needs.change-scope.outputs.full != 'false' }}
        id: verification
        env:
          KORA_SCAFFOLD_RUN: ${{ github.run_id }}
          KORA_SCAFFOLD_ATTEMPT: ${{ github.run_attempt }}
          KORA_WORKFLOW_REVISION: ${{ github.sha }}
          KORA_REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          KORA_SCAFFOLD_LANES: ${{ needs.scaffold-plan.outputs.lanes }}
        run: |
          KORA_CHECKOUT_REVISION="$(git rev-parse HEAD)"
          test "$KORA_CHECKOUT_REVISION" = "$KORA_WORKFLOW_REVISION"
          uv run --no-sync python -m tests.scaffold_evidence verify \
            scaffold-evidence "$KORA_SCAFFOLD_RUN" "$KORA_SCAFFOLD_ATTEMPT" \
            "$KORA_CHECKOUT_REVISION" "$KORA_REQUESTED_REVISION" "$KORA_SCAFFOLD_LANES"
      - name: Record join workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require all test lanes and collection evidence
        id: completion
        if: ${{ always() }}
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          SCOPE_VERIFIED: ${{ needs.change-scope.outputs.verified }}
          FULL_SCOPE: ${{ needs.change-scope.outputs.full }}
          PLAN_RESULT: ${{ needs.scaffold-plan.result }}
          LANES_RESULT: ${{ needs.scaffold-tests.result }}
          MACOS_LANES_RESULT: ${{ needs.scaffold-tests-macos.result }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.evidence_download.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: bash scripts/ci/require_outcomes.sh scaffold-evidence

  scaffold:
    name: Scaffold (${{ matrix.os }}, Python ${{ matrix.python }})
    if: ${{ always() }}
    needs: [scaffold-evidence, changed-test-repetition]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: 3.11.17
          - os: ubuntu-24.04
            python: 3.15.0
          - os: macos-15
            python: 3.11.17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require verified scaffold evidence
        if: ${{ always() }}
        env:
          EVIDENCE_RESULT: ${{ needs.scaffold-evidence.result }}
          EVIDENCE_VERIFIED: ${{ needs.scaffold-evidence.outputs.verified }}
          REPETITION_RESULT: ${{ needs.changed-test-repetition.result }}
        run: |
          bash scripts/ci/require_outcomes.sh check \
            EVIDENCE_RESULT=success \
            EVIDENCE_VERIFIED=true \
            REPETITION_RESULT=success

  local-runtime-diagnostics:
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: Local runtime diagnostics (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: 3.11.17
          - os: ubuntu-24.04
            python: 3.15.0
          - os: macos-15
            python: 3.11.17
    env:
      PYTHONPATH: src
      KORA_TEST_DATABASES: sqlite
      KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-uv-python-${{ matrix.python }}-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified uv and Python
        env:
          KORA_UV_PYTHON: ${{ matrix.python }}
        run: bash scripts/ci/setup_uv_cache.sh "$KORA_UV_PYTHON"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: local-runtime-diagnostics-${{ matrix.python }}
      - name: Install locked source for isolated runner processes
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
          KORA_DIAGNOSTIC_BUILD_CONSTRAINTS="$(mktemp)"
          uv export --locked --only-group build --no-emit-project \
            --format requirements.txt --output-file "$KORA_DIAGNOSTIC_BUILD_CONSTRAINTS"
          uv pip install --python "$PWD/.venv/bin/python" --no-deps \
            --build-constraints "$KORA_DIAGNOSTIC_BUILD_CONSTRAINTS" \
            --require-build-hashes --editable .
          rm "$KORA_DIAGNOSTIC_BUILD_CONSTRAINTS"
      - name: Measure local runtime cost
        env:
          KORA_MEASUREMENT_OUTPUT: measurements/local-runtime-cost.json
        run: |
          mkdir -p measurements
          bash scripts/ci/run-local-runtime-tests.sh uv run --no-sync pytest -q -m measurement tests/measurements/test_local_runtime_cost.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: local-runtime-diagnostics-${{ matrix.os }}-${{ matrix.python }}
          path: measurements/local-runtime-cost.json
          if-no-files-found: error

  cel-producer:
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: CEL lifetime and representative cost
    outputs:
      verified: ${{ steps.required_measurements.outputs.verified }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      KORA_TEST_DATABASES: sqlite
      KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      KORA_MEASUREMENT_OUTPUT: measurements/cel-evaluator-lifetime.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-uv-python-3.11.17-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified uv and Python
        run: bash scripts/ci/setup_uv_cache.sh 3.11.17
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: cel-measurements
      - name: Install locked wheel dependencies
        id: dependencies
        run: uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
      - name: Record checked-out revision
        id: source_revision
        run: |
          mkdir -p measurements
          git rev-parse HEAD > measurements/cel-checkout-revision.txt
      - name: Measure evaluator lifetime and diagnostics
        id: measurement
        if: ${{ !cancelled() }}
        run: uv run --no-sync pytest -q -p no:logging -m measurement tests/measurements/test_cel_evaluator_lifetime.py
      - name: Check representative evaluation cost
        id: cost_regression
        if: ${{ !cancelled() }}
        env:
          KORA_CEL_COST_OUTPUT: measurements/cel-cost-smoke.json
        run: uv run --no-sync pytest -q -p no:logging -m measurement tests/measurements/test_cel_cost_regression.py
      - name: Check required CEL evidence files
        id: cel_artifacts
        if: ${{ always() && !cancelled() }}
        run: |
          test -s measurements/cel-evaluator-lifetime.json
          test -s measurements/cel-cost-smoke.json
          test "$(cat measurements/cel-checkout-revision.txt)" = "$KORA_MEASUREMENT_REVISION"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: cost_upload
        if: ${{ always() && steps.cost_regression.outcome != 'skipped' }}
        with:
          name: cel-cost-regression-measurement
          path: |
            measurements/cel-cost-smoke.json
            measurements/cel-checkout-revision.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: lifetime_upload
        if: ${{ always() && steps.measurement.outcome != 'skipped' }}
        with:
          name: cel-evaluator-lifetime-measurement
          path: |
            measurements/cel-evaluator-lifetime.json
            measurements/cel-checkout-revision.txt
          if-no-files-found: error
      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require every producer step
        id: required_measurements
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_REVISION_OUTCOME: ${{ steps.source_revision.outcome }}
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
          COST_REGRESSION_OUTCOME: ${{ steps.cost_regression.outcome }}
          CEL_ARTIFACTS_OUTCOME: ${{ steps.cel_artifacts.outcome }}
          COST_UPLOAD_OUTCOME: ${{ steps.cost_upload.outcome }}
          LIFETIME_UPLOAD_OUTCOME: ${{ steps.lifetime_upload.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: |
          bash scripts/ci/require_outcomes.sh verify \
            DEPENDENCIES_OUTCOME=success \
            SOURCE_REVISION_OUTCOME=success \
            MEASUREMENT_OUTCOME=success \
            COST_REGRESSION_OUTCOME=success \
            CEL_ARTIFACTS_OUTCOME=success \
            COST_UPLOAD_OUTCOME=success \
            LIFETIME_UPLOAD_OUTCOME=success \
            WORKFLOW_CANCELLED=false

  cel-measurements:
    name: CEL evaluator lifetime
    needs: [change-scope, scaffold-evidence, cel-producer]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      KORA_TEST_DATABASES: sqlite
      KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record checked-out revision
        id: source_revision
        run: |
          mkdir -p measurements
          git rev-parse HEAD > measurements/cel-checkout-revision.txt
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        id: cel_lifetime_download
        if: ${{ needs.change-scope.outputs.full != 'false' && (always() && !cancelled()) }}
        with:
          name: cel-evaluator-lifetime-measurement
          path: measurements/cel-lifetime
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        id: cel_cost_download
        if: ${{ needs.change-scope.outputs.full != 'false' && (always() && !cancelled()) }}
        with:
          name: cel-cost-regression-measurement
          path: measurements/cel-cost
      - name: Verify exact CEL evidence and both source receipts
        id: cel_inventory
        if: ${{ needs.change-scope.outputs.full != 'false' && (always() && !cancelled() && steps.cel_lifetime_download.outcome == 'success' && steps.cel_cost_download.outcome == 'success') }}
        run: bash scripts/ci/check_evidence_inventory.sh cel
      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ needs.change-scope.outputs.full != 'false' && (cancelled()) }}
        run: exit 0
      - name: Require every measurement and artifact
        id: required_measurements
        if: ${{ always() }}
        env:
          SCAFFOLD_RESULT: ${{ needs.scaffold-evidence.result }}
          SCAFFOLD_VERIFIED: ${{ needs.scaffold-evidence.outputs.verified }}
          CEL_RESULT: ${{ needs.cel-producer.result }}
          CEL_VERIFIED: ${{ needs.cel-producer.outputs.verified }}
          SOURCE_REVISION_OUTCOME: ${{ steps.source_revision.outcome }}
          CEL_LIFETIME_DOWNLOAD_OUTCOME: ${{ steps.cel_lifetime_download.outcome }}
          CEL_COST_DOWNLOAD_OUTCOME: ${{ steps.cel_cost_download.outcome }}
          CEL_INVENTORY_OUTCOME: ${{ steps.cel_inventory.outcome }}
          WORKFLOW_CANCELLED: ${{ job.status == 'cancelled' || steps.workflow_cancellation.outcome != 'skipped' }}
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          SCOPE_VERIFIED: ${{ needs.change-scope.outputs.verified }}
          FULL_SCOPE: ${{ needs.change-scope.outputs.full }}
        run: bash scripts/ci/require_outcomes.sh cel-measurements

  browser:
    name: Console browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      KORA_BROWSER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified Node
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        run: bash scripts/ci/setup_scaffold_node.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: web/package.json
          run_install: false
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - name: Install pinned browser tools
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          pnpm --dir web install --frozen-lockfile
          python3 scripts/ci/acquire.py run 120 -- \
            pnpm --dir web exec playwright install --with-deps --only-shell chromium
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - name: Check and build browser sources
        run: |
          pnpm --dir web run typecheck
          pnpm --dir web run lint
          pnpm --dir web run build
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - name: Run browser checks
        run: pnpm --dir web run test:browser
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        id: verification
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ needs.change-scope.outputs.full != 'false' && (always()) }}
        with:
          name: console-browser-checks
          path: measurements/browser/
          if-no-files-found: error
          retention-days: 14

      - name: Require browser verification or approved editorial scope
        if: ${{ always() }}
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          SCOPE_VERIFIED: ${{ needs.change-scope.outputs.verified }}
          FULL_SCOPE: ${{ needs.change-scope.outputs.full }}
          BROWSER_RESULT: ${{ steps.verification.outcome }}
          CANCELLED: ${{ job.status == 'cancelled' }}
        run: bash scripts/ci/require_outcomes.sh browser
    needs:
      - change-scope
    if: ${{ always() }}

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified Node
        run: bash scripts/ci/setup_scaffold_node.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: Install pinned Markdown linter
        run: python3 scripts/ci/acquire.py run 60 -- npx --yes markdownlint-cli@0.45.0 --version
      - name: Lint repository Markdown
        shell: bash
        env:
          npm_config_prefer_offline: "true"
        run: |
          set -euo pipefail
          KORA_DOC_FILES="$(mktemp)"
          git ls-files --cached --others --exclude-standard -z -- '*.md' > "$KORA_DOC_FILES"
          test -s "$KORA_DOC_FILES"
          xargs -0 npx --yes markdownlint-cli@0.45.0 -- < "$KORA_DOC_FILES"

  links:
    name: Links and anchors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-lychee-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Check repository Markdown offline
        run: bash scripts/ci/check_links.sh

  mermaid:
    name: Mermaid diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified Node
        run: bash scripts/ci/setup_scaffold_node.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: Install diagram discovery tool
        run: sudo --preserve-env=RUNNER_TEMP bash scripts/ci/apt_install.sh ripgrep
      - name: Install pinned Mermaid renderer
        run: python3 scripts/ci/acquire.py run 90 -- npx --yes @mermaid-js/mermaid-cli@12.0.0 --version
      - name: Parse every Mermaid diagram
        shell: bash
        env:
          npm_config_prefer_offline: "true"
        run: |
          set -euo pipefail
          KORA_DOC_FILES="$(mktemp)"
          git ls-files --cached --others --exclude-standard -z -- '*.md' > "$KORA_DOC_FILES"
          test -s "$KORA_DOC_FILES"
          KORA_MERMAID_FILES="$(mktemp)"
          xargs -0 rg --files-with-matches --null '^```mermaid' -- \
            < "$KORA_DOC_FILES" > "$KORA_MERMAID_FILES"
          test -s "$KORA_MERMAID_FILES"
          out="$(mktemp -d)"
          while IFS= read -r -d '' file; do
            echo "parsing $file"
            npx --yes @mermaid-js/mermaid-cli@12.0.0 --quiet \
              --puppeteerConfigFile .github/puppeteer-config.json \
              --input "$file" --output "$out/${file//\//_}" --artefacts "$out"
          done < "$KORA_MERMAID_FILES"

  ir-examples:
    name: Example graph documents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-uv-python-3.11.17-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified uv and Python
        run: bash scripts/ci/setup_uv_cache.sh 3.11.17
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.13.1
          python-version: 3.11.17
          cache-suffix: ir-examples
      - name: Prepare source-owned IR schemas and independent corpus
        run: |
          uv sync --locked --no-build --no-install-project
          PYTHONPATH=src uv run --no-sync python -m tests.ir.schema_document_cases measurements/ir-schema-checker
          git rev-parse HEAD > measurements/ir-schema-checker-revision.txt
      - name: Check actual model modes, committed schema and independent corpus
        run: |
          uvx --python 3.11.17 --from check-jsonschema@0.38.2 --with pyright==1.1.414 python -c 'import subprocess, sys; subprocess.run([sys.executable, "-m", "pyright", "--pythonpath", sys.executable, ".github/check_ir_schema.py"], check=True)'
          uvx --python 3.11.17 --from check-jsonschema@0.38.2 --with pyright==1.1.414 python .github/check_ir_schema.py measurements/ir-schema-checker > measurements/ir-schema-checker-results.json
      - run: uvx check-jsonschema@0.38.2 --schemafile knowledge/specs/ir.schema.json knowledge/specs/examples/*.ir.yaml
      - run: uvx check-jsonschema@0.38.2 --schemafile knowledge/specs/scenario.schema.json knowledge/specs/examples/scenarios/*/*.yaml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: ir-schema-checker-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            measurements/ir-schema-checker/
            measurements/ir-schema-checker-results.json
            measurements/ir-schema-checker-revision.txt
          if-no-files-found: error

  github-templates:
    name: GitHub templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-uv-python-3.11.17-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified uv and Python
        run: bash scripts/ci/setup_uv_cache.sh 3.11.17
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.13.1
          python-version: 3.11.17
          cache-suffix: github-templates
      - run: uvx check-jsonschema@0.38.2 --builtin-schema vendor.github-issue-forms .github/ISSUE_TEMPLATE/change.yml
      - run: uvx check-jsonschema@0.38.2 --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml

  mutation-tooling:
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: Mutation tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}/kora-acquisitions
          key: kora-acquisitions-${{ runner.os }}-${{ runner.arch }}-uv-python-3.11.17-${{ hashFiles('scripts/ci/acquire.py') }}
      - name: Prepare verified uv and Python
        run: bash scripts/ci/setup_uv_cache.sh 3.11.17
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          cache-suffix: mutation-tooling-${{ matrix.os }}
      - run: uv sync --locked --group build --no-build --no-install-project
      - run: uv sync --locked --group mutation --group build --no-build-isolation
      - run: uv pip install --python .venv/bin/python --no-deps --no-build-isolation --editable .
      - run: uv run --no-sync python -B -m tests.tooling.native_probe
