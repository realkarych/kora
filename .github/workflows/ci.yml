          - run: 3
            pytest-arguments: >-
              'tests/measurements/test_ir_models_cost.py::test_ir_schema_repeated_lifetime[0]' 'tests/measurements/test_ir_models_cost.py::test_ir_model_validation_cost' 'tests/measurements/test_ir_models_cost.py::test_agent_session_action_cost' 'tests/measurements/test_ir_models_cost.py::test_agent_session_validation_lifetime' 'tests/measurements/test_ir_models_cost.py::test_command_result_action_cost' 'tests/measurements/test_ir_models_cost.py::test_command_result_validation_lifetime' 'tests/measurements/test_ir_models_cost.py::test_structured_output_action_cost' 'tests/measurements/test_ir_models_cost.py::test_structured_output_validation_lifetime' -k 'not test_ir_model_validation_cost or (test_ir_model_validation_cost[remaining_)'
          - run: 4
            pytest-arguments: >-
              'tests/measurements/test_ir_models_cost.py::test_ir_schema_repeated_lifetime[1]' 'tests/measurements/test_ir_models_cost.py::test_ir_model_validation_cost' -k 'not test_ir_model_validation_cost or (test_ir_model_validation_cost[config_ or test_ir_model_validation_cost[document_)'
          - run: 5
            pytest-arguments: >-
              'tests/measurements/test_ir_models_cost.py::test_ir_schema_repeated_lifetime[2]' 'tests/measurements/test_ir_models_cost.py::test_ir_model_validation_cost' 'tests/measurements/test_ir_models_cost.py::test_vcs_ref_validation_lifetime' -k 'not test_ir_model_validation_cost or (not (test_ir_model_validation_cost[dense_ or test_ir_model_validation_cost[schema_ or test_ir_model_validation_cost[control_ or test_ir_model_validation_cost[remaining_ or test_ir_model_validation_cost[config_ or test_ir_model_validation_cost[document_))'
    env:
      KORA_TEST_DATABASES: sqlite
      KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      KORA_MEASUREMENT_OUTPUT: measurements/ir-models-cost-${{ matrix.run }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ir-measurements-${{ matrix.run }}
