        shell: bash
    env:
      KORA_TEST_DATABASES: sqlite,postgresql
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.15.0
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: pricing-measurements
      - name: Install locked dependencies
        id: dependencies
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
          KORA_BUILD_CONSTRAINT_DIR="$(mktemp -d)"
          uv export --locked --only-group build --no-emit-project \
            --format requirements.txt \
            --output-file "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" \
            --target "$KORA_BUILD_CONSTRAINT_DIR/backend" \
            --require-hashes \
            --requirements "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" --no-deps \
            --build-constraints "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-build-hashes \
            --editable .
          printf 'KORA_BUILD_CONSTRAINT_DIR=%s\n' "$KORA_BUILD_CONSTRAINT_DIR" >> "$GITHUB_ENV"
      - name: Record actual and requested source revisions
        id: source_revision
        env:
          KORA_WORKFLOW_REVISION: ${{ github.sha }}
          KORA_REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_CHECKOUT_REVISION="$(git rev-parse HEAD)"
          test "$KORA_CHECKOUT_REVISION" = "$KORA_WORKFLOW_REVISION"
          printf 'Actual checkout: %s\nRequested measurement revision: %s\n' "$KORA_CHECKOUT_REVISION" "$KORA_REQUESTED_REVISION"
          printf 'checkout_revision=%s\n' "$KORA_CHECKOUT_REVISION" >> "$GITHUB_OUTPUT"
      - name: Provision isolated Python 3.11 pricing environment
        id: pricing_environment
        run: |
          KORA_PRICING_ROOT="$(mktemp -d "$RUNNER_TEMP/kora-pricing.XXXXXXXX")"
          printf 'KORA_PRICING_ROOT=%s\n' "$KORA_PRICING_ROOT" >> "$GITHUB_ENV"
          "$PWD/.venv/bin/python" -c 'import sys; assert sys.version_info[:3] == (3, 15, 0)'
          sha256sum .venv/pyvenv.cfg > "$KORA_PRICING_ROOT/original-environment.sha256"
          uv pip freeze --python "$PWD/.venv/bin/python" > "$KORA_PRICING_ROOT/original-packages.txt"
          sha256sum pyproject.toml uv.lock web/package.json web/pnpm-lock.yaml web/pnpm-workspace.yaml > "$KORA_PRICING_ROOT/dependencies.sha256"
          uv python install 3.11.17
          KORA_PRICING_BASE="$(uv python find --managed-python 3.11.17)"
          export UV_PROJECT_ENVIRONMENT="$KORA_PRICING_ROOT/environment"
          export UV_PYTHON="$KORA_PRICING_BASE"
          uv sync --python "$KORA_PRICING_BASE" --locked --no-build --group build --extra postgres --extra cel --no-install-project
          uv export --python "$KORA_PRICING_BASE" --locked --only-group build --no-emit-project \
            --format requirements.txt --output-file "$KORA_PRICING_ROOT/constraints.txt"
          uv pip install --python "$KORA_PRICING_ROOT/environment/bin/python" \
            --target "$KORA_PRICING_ROOT/backend" --require-hashes \
            --requirements "$KORA_PRICING_ROOT/constraints.txt"
          uv pip install --python "$KORA_PRICING_ROOT/environment/bin/python" --no-deps \
            --build-constraints "$KORA_PRICING_ROOT/constraints.txt" --require-build-hashes --editable .
          "$KORA_PRICING_ROOT/environment/bin/python" -c 'import sys; assert sys.version_info[:3] == (3, 11, 17)'
          sha256sum --check "$KORA_PRICING_ROOT/original-environment.sha256"
          uv pip freeze --python "$PWD/.venv/bin/python" > "$KORA_PRICING_ROOT/packages-after.txt"
          cmp "$KORA_PRICING_ROOT/original-packages.txt" "$KORA_PRICING_ROOT/packages-after.txt"
          "$PWD/.venv/bin/python" -c 'import sys; assert sys.version_info[:3] == (3, 15, 0)'
          sha256sum --check "$KORA_PRICING_ROOT/dependencies.sha256"
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml
      - name: Measure complete pricing database lifetime
        id: pricing_measurement
        env:
          KORA_TEST_DATABASES: sqlite,postgresql
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          KORA_PRICING_EVIDENCE: ${{ github.workspace }}/measurements/pricing-database-lifetime
        run: |
          "$KORA_PRICING_ROOT/environment/bin/python" -c \
            'import sys; from tests.measurements.pricing_lifetime_support import pricing_command; sys.exit(pricing_command())'
      - name: Verify pricing isolation
        id: pricing_isolation
        if: ${{ !cancelled() && steps.pricing_environment.outcome != 'skipped' }}
        run: |
          "$PWD/.venv/bin/python" -c 'import sys; assert sys.version_info[:3] == (3, 15, 0)'
          sha256sum --check "$KORA_PRICING_ROOT/original-environment.sha256"
          uv pip freeze --python "$PWD/.venv/bin/python" > "$KORA_PRICING_ROOT/packages-final.txt"
          cmp "$KORA_PRICING_ROOT/original-packages.txt" "$KORA_PRICING_ROOT/packages-final.txt"
          sha256sum --check "$KORA_PRICING_ROOT/dependencies.sha256"
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml
          printf 'KORA_PRICING_ISOLATION_VERIFIED=true\n' >> "$GITHUB_ENV"
      - name: Release pricing environment and retain lifecycle proof
        id: pricing_release
        if: ${{ always() && steps.pricing_environment.outcome != 'skipped' }}
        run: |
          "$PWD/.venv/bin/python" -c \
            'from tests.measurements.pricing_lifetime_support import pricing_environment_release; pricing_environment_release()'
      - name: Prepare bounded pricing publication
        id: pricing_publication
        if: ${{ !cancelled() && steps.pricing_environment.outcome != 'skipped' }}
        env:
          KORA_PRICING_MEASUREMENT_OUTCOME: ${{ steps.pricing_measurement.outcome }}
          KORA_PRICING_RELEASE_OUTCOME: ${{ steps.pricing_release.outcome }}
          KORA_PRICING_EVIDENCE: ${{ github.workspace }}/measurements/pricing-database-lifetime
        run: |
          "$PWD/.venv/bin/python" -c \
            'from tests.measurements.pricing_lifetime_support import pricing_publication_prepare; pricing_publication_prepare()'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: pricing_upload
        if: ${{ !cancelled() && steps.pricing_publication.outputs.ready == 'true' }}
        with:
          name: pricing-database-lifetime-measurement
          path: ${{ steps.pricing_publication.outputs.directory }}
          if-no-files-found: error
      - name: Release pricing publication
        id: pricing_publication_release
        if: ${{ always() && steps.pricing_publication.outputs.identity != '' }}
        env:
          KORA_PRICING_PUBLICATION: ${{ steps.pricing_publication.outputs.identity }}
        run: |
          "$PWD/.venv/bin/python" -c \
            'from tests.measurements.pricing_lifetime_support import pricing_publication_release; pricing_publication_release()'
      - name: Check the synced environment and unchanged dependency files
        id: final_sync
        if: ${{ always() && !cancelled() }}
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml
      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require every producer step
        id: required_measurements
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_REVISION_OUTCOME: ${{ steps.source_revision.outcome }}
          PRICING_ENVIRONMENT_OUTCOME: ${{ steps.pricing_environment.outcome }}
          PRICING_MEASUREMENT_OUTCOME: ${{ steps.pricing_measurement.outcome }}
          PRICING_ISOLATION_OUTCOME: ${{ steps.pricing_isolation.outcome }}
          PRICING_RELEASE_OUTCOME: ${{ steps.pricing_release.outcome }}
          PRICING_PUBLICATION_OUTCOME: ${{ steps.pricing_publication.outcome }}
          PRICING_UPLOAD_OUTCOME: ${{ steps.pricing_upload.outcome }}
          PRICING_PUBLICATION_RELEASE_OUTCOME: ${{ steps.pricing_publication_release.outcome }}
          FINAL_SYNC_OUTCOME: ${{ steps.final_sync.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: |
          test "$DEPENDENCIES_OUTCOME" = success
          test "$SOURCE_REVISION_OUTCOME" = success
          test "$PRICING_ENVIRONMENT_OUTCOME" = success
          test "$PRICING_MEASUREMENT_OUTCOME" = success
          test "$PRICING_ISOLATION_OUTCOME" = success
          test "$PRICING_RELEASE_OUTCOME" = success
          test "$PRICING_PUBLICATION_OUTCOME" = success
          test "$PRICING_UPLOAD_OUTCOME" = success
          test "$PRICING_PUBLICATION_RELEASE_OUTCOME" = success
          test "$FINAL_SYNC_OUTCOME" = success
          test "$WORKFLOW_CANCELLED" = false
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

  git-publication-measurements:
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: Git publication measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.required_measurements.outputs.verified }}
      checkout_revision: ${{ steps.source_revision.outputs.checkout_revision }}
    defaults:
      run:
        shell: bash
    env:
      KORA_TEST_DATABASES: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: git-publication-measurements
      - name: Install locked dependencies
        id: dependencies
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
          KORA_BUILD_CONSTRAINT_DIR="$(mktemp -d)"
          uv export --locked --only-group build --no-emit-project \
            --format requirements.txt \
            --output-file "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" \
            --target "$KORA_BUILD_CONSTRAINT_DIR/backend" \
            --require-hashes \
            --requirements "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" --no-deps \
            --build-constraints "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-build-hashes \
            --editable .
          printf 'KORA_BUILD_CONSTRAINT_DIR=%s\n' "$KORA_BUILD_CONSTRAINT_DIR" >> "$GITHUB_ENV"
      - name: Record actual and requested source revisions
        id: source_revision
        env:
          KORA_WORKFLOW_REVISION: ${{ github.sha }}
          KORA_REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_CHECKOUT_REVISION="$(git rev-parse HEAD)"
          test "$KORA_CHECKOUT_REVISION" = "$KORA_WORKFLOW_REVISION"
          printf 'Actual checkout: %s\nRequested measurement revision: %s\n' "$KORA_CHECKOUT_REVISION" "$KORA_REQUESTED_REVISION"
          printf 'checkout_revision=%s\n' "$KORA_CHECKOUT_REVISION" >> "$GITHUB_OUTPUT"
      - name: Measure git publication cost and resource lifetime
        id: git_publication_measurement
        env:
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_MEASUREMENT_OUTPUT=measurements/git-publication-cost.json \
            uv run --no-sync pytest -q -p no:logging -m measurement tests/measurements/test_git_publication_cost.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        id: git_publication_upload
        if: ${{ !cancelled() && steps.git_publication_measurement.outcome != 'skipped' }}
        with:
          name: git-publication-cost-measurement
          path: measurements/git-publication-cost.json
          if-no-files-found: error
      - name: Check the synced environment and unchanged dependency files
        id: final_sync
        if: ${{ always() && !cancelled() }}
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml
      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require every producer step
        id: required_measurements
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_REVISION_OUTCOME: ${{ steps.source_revision.outcome }}
          GIT_PUBLICATION_MEASUREMENT_OUTCOME: ${{ steps.git_publication_measurement.outcome }}
          GIT_PUBLICATION_UPLOAD_OUTCOME: ${{ steps.git_publication_upload.outcome }}
          FINAL_SYNC_OUTCOME: ${{ steps.final_sync.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: |
          test "$DEPENDENCIES_OUTCOME" = success
          test "$SOURCE_REVISION_OUTCOME" = success
          test "$GIT_PUBLICATION_MEASUREMENT_OUTCOME" = success
          test "$GIT_PUBLICATION_UPLOAD_OUTCOME" = success
          test "$FINAL_SYNC_OUTCOME" = success
          test "$WORKFLOW_CANCELLED" = false
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

  ir-measurements:
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: IR model measurements (${{ matrix.run }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - run: 0
            pytest-arguments: >-
              tests/measurements/test_ir_models_cost.py '--deselect=tests/measurements/test_ir_models_cost.py::test_ir_configuration_repeated_lifetime[1]' '--deselect=tests/measurements/test_ir_models_cost.py::test_ir_configuration_repeated_lifetime[2]' '--deselect=tests/measurements/test_ir_models_cost.py::test_cost_checker_refuses_unexpected_acceptance' '--deselect=tests/measurements/test_ir_models_cost.py::test_cost_checker_refuses_unexpected_rejection' '--deselect=tests/measurements/test_ir_models_cost.py::test_cost_checker_releases_nested_values' '--deselect=tests/measurements/test_ir_models_cost.py::test_cost_process_failure_preserves_lossless_evidence' '--deselect=tests/measurements/test_ir_models_cost.py::test_accounting_value_cost' '--deselect=tests/measurements/test_ir_models_cost.py::test_accounting_value_lifetime' '--deselect=tests/measurements/test_ir_models_cost.py::test_ir_schema_repeated_lifetime[0]' '--deselect=tests/measurements/test_ir_models_cost.py::test_ir_schema_repeated_lifetime[1]' '--deselect=tests/measurements/test_ir_models_cost.py::test_ir_schema_repeated_lifetime[2]' '--deselect=tests/measurements/test_ir_models_cost.py::test_vcs_ref_validation_lifetime' '--deselect=tests/measurements/test_ir_models_cost.py::test_agent_session_action_cost' '--deselect=tests/measurements/test_ir_models_cost.py::test_agent_session_validation_lifetime' '--deselect=tests/measurements/test_ir_models_cost.py::test_command_result_action_cost' '--deselect=tests/measurements/test_ir_models_cost.py::test_command_result_validation_lifetime' '--deselect=tests/measurements/test_ir_models_cost.py::test_structured_output_action_cost' '--deselect=tests/measurements/test_ir_models_cost.py::test_structured_output_validation_lifetime' -k 'not test_ir_model_validation_cost or test_ir_model_validation_cost[dense_'
          - run: 1
            pytest-arguments: >-
              'tests/measurements/test_ir_models_cost.py::test_ir_configuration_repeated_lifetime[1]' 'tests/measurements/test_ir_models_cost.py::test_ir_configuration_repeated_lifetime[2]' 'tests/measurements/test_ir_models_cost.py::test_cost_checker_refuses_unexpected_acceptance' 'tests/measurements/test_ir_models_cost.py::test_cost_checker_refuses_unexpected_rejection' 'tests/measurements/test_ir_models_cost.py::test_cost_checker_releases_nested_values' 'tests/measurements/test_ir_models_cost.py::test_cost_process_failure_preserves_lossless_evidence' 'tests/measurements/test_ir_models_cost.py::test_accounting_value_cost' 'tests/measurements/test_ir_models_cost.py::test_ir_model_validation_cost' -k 'not test_ir_model_validation_cost or (test_ir_model_validation_cost[schema_)'
          - run: 2
            pytest-arguments: >-
