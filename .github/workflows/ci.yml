name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Classify verification scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.full }}
      verified: ${{ steps.scope.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify with approved base instructions
        id: scope
        env:
          KORA_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          KORA_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          KORA_EVENT_NAME: ${{ github.event_name }}
        run: |
          KORA_SCOPE_PROGRAM="$(mktemp)"
          if test "$KORA_EVENT_NAME" = pull_request && git show "$KORA_BASE_REVISION:scripts/ci/editorial_scope.py" > "$KORA_SCOPE_PROGRAM"; then
            python3 "$KORA_SCOPE_PROGRAM"
          else
            printf 'full=true\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

  scaffold-tests:
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: Scaffold tests (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: 3.11.17
            databases: sqlite,postgresql
            lane: conformance
            pytest-arguments: --ignore=tests/plugins/storage --ignore=tests/conformance/test_artifact_storage_conformance.py --ignore=tests/conformance/test_installed_conformance.py --ignore=tests/plugins/runtime/local
          - os: ubuntu-24.04
            python: 3.11.17
            databases: sqlite,postgresql
            lane: remainder
            pytest-arguments: --ignore=tests/plugins/storage --ignore=tests/conformance/test_artifact_storage_conformance.py --ignore=tests/conformance/test_installed_conformance.py --ignore=tests/plugins/runtime/local
          - os: ubuntu-24.04
            python: 3.11.17
            databases: sqlite,postgresql
            lane: storage
            pytest-arguments: tests/plugins/storage tests/conformance/test_artifact_storage_conformance.py tests/conformance/test_installed_conformance.py
          - os: ubuntu-24.04
            python: 3.11.17
            databases: sqlite,postgresql
            lane: local-runtime
            pytest-arguments: tests/plugins/runtime/local
          - os: ubuntu-24.04
            python: 3.15.0
            databases: sqlite,postgresql
            lane: conformance
            pytest-arguments: --ignore=tests/plugins/storage --ignore=tests/conformance/test_artifact_storage_conformance.py --ignore=tests/conformance/test_installed_conformance.py --ignore=tests/plugins/runtime/local
          - os: ubuntu-24.04
            python: 3.15.0
            databases: sqlite,postgresql
            lane: remainder
            pytest-arguments: --ignore=tests/plugins/storage --ignore=tests/conformance/test_artifact_storage_conformance.py --ignore=tests/conformance/test_installed_conformance.py --ignore=tests/plugins/runtime/local
          - os: ubuntu-24.04
            python: 3.15.0
            databases: sqlite,postgresql
            lane: storage
            pytest-arguments: tests/plugins/storage tests/conformance/test_artifact_storage_conformance.py tests/conformance/test_installed_conformance.py
          - os: ubuntu-24.04
            python: 3.15.0
            databases: sqlite,postgresql
            lane: local-runtime
            pytest-arguments: tests/plugins/runtime/local
          - os: macos-15
            python: 3.11.17
            databases: sqlite
            lane: conformance
            pytest-arguments: --ignore=tests/plugins/storage --ignore=tests/conformance/test_artifact_storage_conformance.py --ignore=tests/conformance/test_installed_conformance.py --ignore=tests/plugins/runtime/local
          - os: macos-15
            python: 3.11.17
            databases: sqlite
            lane: remainder
            pytest-arguments: --ignore=tests/plugins/storage --ignore=tests/conformance/test_artifact_storage_conformance.py --ignore=tests/conformance/test_installed_conformance.py --ignore=tests/plugins/runtime/local
          - os: macos-15
            python: 3.11.17
            databases: sqlite
            lane: storage
            pytest-arguments: tests/plugins/storage tests/conformance/test_artifact_storage_conformance.py tests/conformance/test_installed_conformance.py
          - os: macos-15
            python: 3.11.17
            databases: sqlite
            lane: local-runtime
            pytest-arguments: tests/plugins/runtime/local
    defaults:
      run:
        shell: bash
    env:
      KORA_TEST_DATABASES: ${{ matrix.databases }}
      TESTCONTAINERS_RYUK_DISABLED: "true"
      KORA_SCAFFOLD_DIRECTORY: ${{ github.workspace }}/scaffold-evidence/scaffold-tests-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.lane }}
      KORA_SCAFFOLD_RUN: ${{ github.run_id }}
      KORA_SCAFFOLD_ATTEMPT: ${{ github.run_attempt }}
      KORA_WORKFLOW_REVISION: ${{ github.sha }}
      KORA_REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      KORA_PYTEST_ARGUMENTS: ${{ matrix.pytest-arguments }}
      KORA_SCAFFOLD_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: ${{ matrix.lane != 'local-runtime' }}
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        if: ${{ matrix.lane != 'local-runtime' }}
        with:
          package_json_file: web/package.json
          run_install: false
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.13.1
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: scaffold-${{ matrix.python }}-${{ matrix.lane }}
      - name: Install locked dependencies
        id: dependencies
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
          KORA_BUILD_CONSTRAINT_DIR="$(mktemp -d)"
          uv export --locked --only-group build --no-emit-project \
            --format requirements.txt \
            --output-file "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" \
            --target "$KORA_BUILD_CONSTRAINT_DIR/backend" \
            --require-hashes \
            --requirements "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" --no-deps \
            --build-constraints "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-build-hashes \
            --editable .
          printf 'KORA_BUILD_CONSTRAINT_DIR=%s\n' "$KORA_BUILD_CONSTRAINT_DIR" >> "$GITHUB_ENV"
      - name: Install locked frontend dependencies
        id: frontend_dependencies
        if: ${{ matrix.lane != 'local-runtime' }}
        run: pnpm --dir web install --frozen-lockfile
      - name: Check Python and frontend sources
        id: static_checks
        if: ${{ matrix.lane == 'conformance' }}
        run: |
          uv lock --check
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check --ignore-noqa .
          uv run --no-sync pyright
          pnpm --dir web run typecheck
          pnpm --dir web run lint
          pnpm --dir web run build
      - name: Verify Linux unit collision ownership
        id: unit_collisions
        if: ${{ matrix.lane == 'local-runtime' && runner.os == 'Linux' }}
        run: |
          sudo bash scripts/ci/check-local-runtime-unit-collisions.sh root
          bash scripts/ci/check-local-runtime-unit-collisions.sh user
      - name: Prepare local runtime host fixtures
        id: preparation
        if: ${{ matrix.lane == 'local-runtime' }}
        run: |
          SECONDS=0
          sudo scripts/ci/prepare-local-runtime-fixtures.sh prepare
          printf 'Host fixture preparation took %s s\n' "$SECONDS"
      - name: Collect and execute the exact test lane
        id: tests
        run: |
          KORA_CHECKOUT_REVISION="$(git rev-parse HEAD)"
          test "$KORA_CHECKOUT_REVISION" = "$KORA_WORKFLOW_REVISION"
          mkdir -p "$KORA_SCAFFOLD_DIRECTORY"
          read -r -a KORA_SCAFFOLD_ARGUMENTS <<< "$KORA_PYTEST_ARGUMENTS"
          if test "$KORA_SCAFFOLD_LANE" = conformance; then
            if uv run --no-sync pytest --collect-only -q -m "not measurement" > "$KORA_SCAFFOLD_DIRECTORY/complete.txt" 2> "$KORA_SCAFFOLD_DIRECTORY/complete.stderr"; then
              printf '0\n' > "$KORA_SCAFFOLD_DIRECTORY/complete.exit"
            else
              KORA_EXIT="$?"
              printf '%s\n' "$KORA_EXIT" > "$KORA_SCAFFOLD_DIRECTORY/complete.exit"
              exit "$KORA_EXIT"
            fi
          fi
          KORA_SCAFFOLD_SELECTION=()
          KORA_TEST_LAUNCH=()
          if test "$KORA_SCAFFOLD_LANE" = local-runtime; then
            KORA_SCAFFOLD_SELECTION=(-m "not measurement")
            KORA_TEST_LAUNCH=(bash scripts/ci/run-local-runtime-tests.sh)
          fi
          KORA_EXIT=0
          if test "$KORA_SCAFFOLD_LANE" != storage && test "$KORA_SCAFFOLD_LANE" != local-runtime; then
            KORA_ORDINARY_OUTPUT="$(mktemp -d "$RUNNER_TEMP/kora-ordinary.XXXXXX")"
            export KORA_ORDINARY_OUTPUT
            printf 'KORA_ORDINARY_OUTPUT=%s\n' "$KORA_ORDINARY_OUTPUT" >> "$GITHUB_ENV"
            if bash -e -o pipefail <<'KORA_ORDINARY_SCRIPT' > "$KORA_SCAFFOLD_DIRECTORY/tests.stdout" 2> "$KORA_SCAFFOLD_DIRECTORY/tests.stderr"; then
          read -r -a general <<< "$KORA_PYTEST_ARGUMENTS"
          case "$KORA_SCAFFOLD_LANE" in
            conformance|remainder) ;;
            *) exit 1 ;;
          esac
          first=(
            tests/conformance/test_conformance_cases_detect_broken_providers.py
            tests/conformance/test_lifetime_helper_phases.py
            tests/conformance/test_lifetime_measurement_cohorts.py
            tests/conformance/test_lifetime_parent_exit.py
            tests/conformance/test_lifetime_pending_helpers.py
            tests/conformance/test_lifetime_resume.py
            tests/conformance/test_lifetime_rpc_concurrency.py
            tests/conformance/test_lifetime_services.py
            tests/conformance/test_local_process_lifetime.py
            tests/conformance/test_parent_lifetime.py
            tests/conformance/test_recovered_process_lifetime.py
          )
          second=(tests/conformance --ignore=tests/conformance/test_artifact_storage_conformance.py --ignore=tests/conformance/test_installed_conformance.py)
          for path in "${first[@]}"; do
            second+=("--ignore=$path")
          done
          measurements=(
            tests/measurements
            tests/db
            tests/plugins
            --ignore=tests/plugins/storage
            --ignore=tests/plugins/runtime/local
            --ignore=tests/plugins/artifact_type/test_agent_session.py
            tests/ir/test_output_schema_resources.py
            tests/ir/test_inline_schema_resources.py
            tests/ir/test_type_schema_resources.py
          )
          integration=(
            tests/api
            tests/cli
            tests/architecture/test_ir_measurement_ci.py
            tests/ir/test_structured_schema_assertions.py
            tests/ir/test_structured_schema_collection_predicates.py
            tests/ir/test_structured_schema_string_lengths.py
            tests/ir/test_subgraph_interface_resources.py
            tests/plugins/artifact_type/test_agent_session.py
          )
          other=(tests --ignore=tests/api --ignore=tests/conformance --ignore=tests/plugins --ignore=tests/cli --ignore=tests/db --ignore=tests/measurements --ignore=tests/ir/test_inline_schema_resources.py --ignore=tests/ir/test_type_schema_resources.py --ignore=tests/ir/test_structured_schema_assertions.py --ignore=tests/ir/test_structured_schema_collection_predicates.py --ignore=tests/ir/test_structured_schema_string_lengths.py --ignore=tests/ir/test_subgraph_interface_resources.py --ignore=tests/architecture/test_ir_measurement_ci.py --ignore=tests/ir/test_output_schema_resources.py)
          pids=()
          case "$KORA_SCAFFOLD_LANE" in
            conformance)
              uv run --no-sync python -m tests.support.ordinary_pytest -v -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-first" --basetemp="$KORA_ORDINARY_OUTPUT/tmp-first" --junitxml="$KORA_ORDINARY_OUTPUT/first.xml" "${first[@]}" > "$KORA_ORDINARY_OUTPUT/first.log" 2>&1 &
              pids+=("$!")
              uv run --no-sync python -m tests.support.ordinary_pytest -v -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-second" --basetemp="$KORA_ORDINARY_OUTPUT/tmp-second" --junitxml="$KORA_ORDINARY_OUTPUT/second.xml" "${second[@]}" > "$KORA_ORDINARY_OUTPUT/second.log" 2>&1 &
              pids+=("$!")
              names=(first second)
              evidence=(first.log second.log first.xml second.xml first.exit second.exit)
              ;;
            remainder)
              uv run --no-sync python -m tests.support.ordinary_pytest -v -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-measurements" --basetemp="$KORA_ORDINARY_OUTPUT/tmp-measurements" --junitxml="$KORA_ORDINARY_OUTPUT/measurements.xml" "${measurements[@]}" > "$KORA_ORDINARY_OUTPUT/measurements.log" 2>&1 &
              pids+=("$!")
              uv run --no-sync python -m tests.support.ordinary_pytest -v -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-integration" --basetemp="$KORA_ORDINARY_OUTPUT/tmp-integration" --junitxml="$KORA_ORDINARY_OUTPUT/integration.xml" "${integration[@]}" > "$KORA_ORDINARY_OUTPUT/integration.log" 2>&1 &
              pids+=("$!")
              uv run --no-sync python -m tests.support.ordinary_pytest -v -o cache_dir="$KORA_ORDINARY_OUTPUT/cache-other" --basetemp="$KORA_ORDINARY_OUTPUT/tmp-other" --junitxml="$KORA_ORDINARY_OUTPUT/other.xml" "${other[@]}" > "$KORA_ORDINARY_OUTPUT/other.log" 2>&1 &
              pids+=("$!")
              names=(measurements integration other)
              evidence=(measurements.log integration.log other.log measurements.xml integration.xml other.xml measurements.exit integration.exit other.exit)
              ;;
            *) exit 1 ;;
          esac
          result=0
          for index in "${!pids[@]}"; do
            if wait "${pids[$index]}"; then
              status=0
            else
              status="$?"
              result=1
            fi
            printf '%s\n' "$status" > "$KORA_ORDINARY_OUTPUT/${names[$index]}.exit"
          done
          for name in "${evidence[@]}"; do
            test -f "$KORA_ORDINARY_OUTPUT/$name"
            test ! -L "$KORA_ORDINARY_OUTPUT/$name"
            test -s "$KORA_ORDINARY_OUTPUT/$name"
          done
          for name in "${evidence[@]}"; do
            case "$name" in
              inventory.json|*.log) cat "$KORA_ORDINARY_OUTPUT/$name" ;;
            esac
          done
          exit "$result"
          KORA_ORDINARY_SCRIPT
              KORA_EXIT=0
            else
              KORA_EXIT="$?"
            fi
            for name in first.log second.log measurements.log integration.log other.log first.xml second.xml measurements.xml integration.xml other.xml first.exit second.exit measurements.exit integration.exit other.exit; do
              if test -f "$KORA_ORDINARY_OUTPUT/$name" && test ! -L "$KORA_ORDINARY_OUTPUT/$name"; then
                cp "$KORA_ORDINARY_OUTPUT/$name" "$KORA_SCAFFOLD_DIRECTORY/$name"
              fi
            done
          elif "${KORA_TEST_LAUNCH[@]}" uv run --no-sync pytest -q "${KORA_SCAFFOLD_SELECTION[@]}" "${KORA_SCAFFOLD_ARGUMENTS[@]}" --junitxml="$KORA_SCAFFOLD_DIRECTORY/junit.xml" > "$KORA_SCAFFOLD_DIRECTORY/tests.stdout" 2> "$KORA_SCAFFOLD_DIRECTORY/tests.stderr"; then
            KORA_EXIT=0
          else
            KORA_EXIT="$?"
          fi
          printf '%s\n' "$KORA_EXIT" > "$KORA_SCAFFOLD_DIRECTORY/tests.exit"
          if test "$KORA_EXIT" != 0; then
            tail -c 65536 "$KORA_SCAFFOLD_DIRECTORY/tests.stdout"
            tail -c 65536 "$KORA_SCAFFOLD_DIRECTORY/tests.stderr"
            exit "$KORA_EXIT"
          fi
          uv run --no-sync python -m tests.scaffold_evidence record \
            "$KORA_SCAFFOLD_DIRECTORY" "$KORA_SCAFFOLD_RUN" "$KORA_SCAFFOLD_ATTEMPT" \
            "$KORA_CHECKOUT_REVISION" "$KORA_REQUESTED_REVISION" \
            '${{ matrix.os }}' '${{ matrix.python }}' '${{ matrix.databases }}' '${{ matrix.lane }}' \
            "${KORA_SCAFFOLD_SELECTION[@]}" "${KORA_SCAFFOLD_ARGUMENTS[@]}"
          tail -c 2048 "$KORA_SCAFFOLD_DIRECTORY/tests.stdout"
      - name: Preserve ordinary cohort evidence
        id: cohort_evidence
        if: ${{ always() && (matrix.lane == 'conformance' || matrix.lane == 'remainder') }}
        run: |
          test -n "${KORA_ORDINARY_OUTPUT:-}"
          for name in first.log second.log measurements.log integration.log other.log first.xml second.xml measurements.xml integration.xml other.xml first.exit second.exit measurements.exit integration.exit other.exit; do
            if test -f "$KORA_ORDINARY_OUTPUT/$name" && test ! -L "$KORA_ORDINARY_OUTPUT/$name"; then
              cp "$KORA_ORDINARY_OUTPUT/$name" "$KORA_SCAFFOLD_DIRECTORY/$name"
            fi
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: evidence_upload
        if: ${{ always() }}
        with:
          name: scaffold-tests-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.lane }}
          path: ${{ env.KORA_SCAFFOLD_DIRECTORY }}
          if-no-files-found: error
      - name: Remove local runtime host fixtures
        id: teardown
        if: ${{ always() && matrix.lane == 'local-runtime' }}
        run: sudo scripts/ci/prepare-local-runtime-fixtures.sh teardown
      - name: Build isolated distributions offline
        id: distributions
        if: ${{ matrix.lane == 'remainder' }}
        run: |
          KORA_BUILD_OFFLINE=1 uv build --offline \
            --python "$PWD/.venv/bin/python" \
            --build-constraints "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-hashes --clear
      - name: Check the synced environment and unchanged dependency files
        id: final_sync
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml

      - name: Record lane workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require complete lane execution
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          PREPARATION_OUTCOME: ${{ steps.preparation.outcome }}
          TEARDOWN_OUTCOME: ${{ steps.teardown.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend_dependencies.outcome }}
          STATIC_OUTCOME: ${{ steps.static_checks.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          DISTRIBUTIONS_OUTCOME: ${{ steps.distributions.outcome }}
          FINAL_SYNC_OUTCOME: ${{ steps.final_sync.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: |
          test "$DEPENDENCIES_OUTCOME" = success
          test "$TESTS_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
          test "$FINAL_SYNC_OUTCOME" = success
          test "$WORKFLOW_CANCELLED" = false
          case "$KORA_SCAFFOLD_LANE" in
            local-runtime)
              test "$PREPARATION_OUTCOME" = success
              test "$TEARDOWN_OUTCOME" = success
              ;;
            *)
              test "$PREPARATION_OUTCOME" = skipped
              test "$TEARDOWN_OUTCOME" = skipped
              ;;
          esac
          case "$KORA_SCAFFOLD_LANE" in
            conformance)
              test "$FRONTEND_OUTCOME" = success
              test "$STATIC_OUTCOME" = success
              test "$DISTRIBUTIONS_OUTCOME" = skipped
              ;;
            remainder)
              test "$FRONTEND_OUTCOME" = success
              test "$STATIC_OUTCOME" = skipped
              test "$DISTRIBUTIONS_OUTCOME" = success
              ;;
            storage)
              test "$FRONTEND_OUTCOME" = success
              test "$STATIC_OUTCOME" = skipped
              test "$DISTRIBUTIONS_OUTCOME" = skipped
              ;;
            local-runtime)
              test "$FRONTEND_OUTCOME" = skipped
              test "$STATIC_OUTCOME" = skipped
              test "$DISTRIBUTIONS_OUTCOME" = skipped
              ;;
            *) exit 1 ;;
          esac

  scaffold-evidence:
    name: Scaffold evidence
    if: ${{ always() }}
    needs: [change-scope, scaffold-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.completion.outputs.verified }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: scaffold-join
      - name: Install locked evidence dependencies
        id: dependencies
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        run: uv sync --locked --no-build --all-extras --no-install-project
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        id: evidence_download
        with:
          pattern: scaffold-tests-*
          path: scaffold-evidence
      - name: Verify twelve lanes and complete collection coverage
        if: ${{ needs.change-scope.outputs.full != 'false' }}
        id: verification
        env:
          KORA_SCAFFOLD_RUN: ${{ github.run_id }}
          KORA_SCAFFOLD_ATTEMPT: ${{ github.run_attempt }}
          KORA_WORKFLOW_REVISION: ${{ github.sha }}
          KORA_REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_CHECKOUT_REVISION="$(git rev-parse HEAD)"
          test "$KORA_CHECKOUT_REVISION" = "$KORA_WORKFLOW_REVISION"
          uv run --no-sync python -m tests.scaffold_evidence verify \
            scaffold-evidence "$KORA_SCAFFOLD_RUN" "$KORA_SCAFFOLD_ATTEMPT" \
            "$KORA_CHECKOUT_REVISION" "$KORA_REQUESTED_REVISION"
      - name: Record join workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require all test lanes and collection evidence
        id: completion
        if: ${{ always() }}
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          SCOPE_VERIFIED: ${{ needs.change-scope.outputs.verified }}
          FULL_SCOPE: ${{ needs.change-scope.outputs.full }}
          LANES_RESULT: ${{ needs.scaffold-tests.result }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.evidence_download.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$SCOPE_VERIFIED" = true
          test "$WORKFLOW_CANCELLED" = false
          if test "$FULL_SCOPE" = false; then
            test "$LANES_RESULT" = skipped
            test "$DEPENDENCIES_OUTCOME" = skipped
            test "$DOWNLOAD_OUTCOME" = skipped
            test "$VERIFICATION_OUTCOME" = skipped
            printf 'verified=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$FULL_SCOPE" = true
          test "$LANES_RESULT" = success
          test "$DEPENDENCIES_OUTCOME" = success
          test "$DOWNLOAD_OUTCOME" = success
          test "$VERIFICATION_OUTCOME" = success
          test "$WORKFLOW_CANCELLED" = false
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

  scaffold:
    name: Scaffold (${{ matrix.os }}, Python ${{ matrix.python }})
    if: ${{ always() }}
    needs: [scaffold-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: 3.11.17
          - os: ubuntu-24.04
            python: 3.15.0
          - os: macos-15
            python: 3.11.17
    steps:
      - name: Require verified scaffold evidence
        env:
          EVIDENCE_RESULT: ${{ needs.scaffold-evidence.result }}
          EVIDENCE_VERIFIED: ${{ needs.scaffold-evidence.outputs.verified }}
        run: |
          test "$EVIDENCE_RESULT" = success
          test "$EVIDENCE_VERIFIED" = true

  local-runtime-diagnostics:
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: Local runtime diagnostics (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: 3.11.17
          - os: ubuntu-24.04
            python: 3.15.0
          - os: macos-15
            python: 3.11.17
    env:
      PYTHONPATH: src
      KORA_TEST_DATABASES: sqlite
      KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: local-runtime-diagnostics-${{ matrix.python }}
      - name: Install locked source for isolated runner processes
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
          KORA_DIAGNOSTIC_BUILD_CONSTRAINTS="$(mktemp)"
          uv export --locked --only-group build --no-emit-project \
            --format requirements.txt --output-file "$KORA_DIAGNOSTIC_BUILD_CONSTRAINTS"
          uv pip install --python "$PWD/.venv/bin/python" --no-deps \
            --build-constraints "$KORA_DIAGNOSTIC_BUILD_CONSTRAINTS" \
            --require-build-hashes --editable .
          rm "$KORA_DIAGNOSTIC_BUILD_CONSTRAINTS"
      - name: Measure local runtime cost
        env:
          KORA_MEASUREMENT_OUTPUT: measurements/local-runtime-cost.json
        run: |
          mkdir -p measurements
          bash scripts/ci/run-local-runtime-tests.sh uv run --no-sync pytest -q -m measurement tests/measurements/test_local_runtime_cost.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: local-runtime-diagnostics-${{ matrix.os }}-${{ matrix.python }}
          path: measurements/local-runtime-cost.json
          if-no-files-found: error

  resource-measurements:
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.full != 'false' }}
    name: Logging, metadata and provider measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.required_measurements.outputs.verified }}
      checkout_revision: ${{ steps.source_revision.outputs.checkout_revision }}
    defaults:
      run:
        shell: bash
    env:
      KORA_TEST_DATABASES: sqlite,postgresql
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: resource-measurements
      - name: Install locked dependencies
        id: dependencies
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
          KORA_BUILD_CONSTRAINT_DIR="$(mktemp -d)"
          uv export --locked --only-group build --no-emit-project \
            --format requirements.txt \
            --output-file "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" \
            --target "$KORA_BUILD_CONSTRAINT_DIR/backend" \
            --require-hashes \
            --requirements "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt"
          uv pip install --python "$PWD/.venv/bin/python" --no-deps \
            --build-constraints "$KORA_BUILD_CONSTRAINT_DIR/constraints.txt" \
            --require-build-hashes \
            --editable .
          printf 'KORA_BUILD_CONSTRAINT_DIR=%s\n' "$KORA_BUILD_CONSTRAINT_DIR" >> "$GITHUB_ENV"
      - name: Record actual and requested source revisions
        id: source_revision
        env:
          KORA_WORKFLOW_REVISION: ${{ github.sha }}
          KORA_REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_CHECKOUT_REVISION="$(git rev-parse HEAD)"
          test "$KORA_CHECKOUT_REVISION" = "$KORA_WORKFLOW_REVISION"
          printf 'Actual checkout: %s\nRequested measurement revision: %s\n' "$KORA_CHECKOUT_REVISION" "$KORA_REQUESTED_REVISION"
          printf 'checkout_revision=%s\n' "$KORA_CHECKOUT_REVISION" >> "$GITHUB_OUTPUT"
      - name: Measure logging overhead and resource lifetime
        id: measurement
        env:
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_MEASUREMENT_OUTPUT=measurements/logging-overhead.json \
            uv run --no-sync pytest -q -p no:logging -m measurement tests/measurements/test_logging_overhead.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        id: logging_upload
        if: ${{ !cancelled() && steps.measurement.outcome != 'skipped' }}
        with:
          name: logging-overhead-measurement
          path: measurements/logging-overhead.json
          if-no-files-found: error
      - name: Measure metadata database lifetime
        id: database_measurement
        env:
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          KORA_MEASUREMENT_OUTPUT=measurements/metadata-database-lifetime.json \
            uv run --no-sync pytest -q -m measurement tests/measurements/test_metadata_database_lifetime.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        id: database_upload
        if: ${{ !cancelled() && steps.database_measurement.outcome != 'skipped' }}
        with:
          name: metadata-database-lifetime-measurement
          path: measurements/metadata-database-lifetime.json
          if-no-files-found: error
      - name: Prepare bounded full-disk mount
        id: full_disk_prepare
        run: |
          mkdir -m 700 measurements/conformance-full-disk
          KORA_FULL_DISK_MOUNT="$(mktemp -d "$RUNNER_TEMP/kora-full-disk.XXXXXX")"
          printf 'KORA_LIFETIME_FULL_DISK_ROOT=%s\n' "$KORA_FULL_DISK_MOUNT" >> "$GITHUB_ENV"
          sudo mount -t tmpfs -o "size=16m,uid=$(id -u),gid=$(id -g),mode=0700,nodev,nosuid" tmpfs "$KORA_FULL_DISK_MOUNT"
          findmnt -n --output SOURCE,FSTYPE,TARGET,OPTIONS --target "$KORA_FULL_DISK_MOUNT" > measurements/conformance-full-disk/mount.txt
      - name: Exercise full-disk admission and registration
        id: full_disk
        run: |
          uv run --no-sync pytest -q --junitxml=measurements/conformance-full-disk/tests.xml tests/conformance/lifetime_full_disk.py
      - name: Preserve full-disk private evidence
        id: full_disk_evidence
        if: ${{ always() && !cancelled() && steps.full_disk_prepare.outcome != 'skipped' }}
        env:
          FULL_DISK_PREPARE_OUTCOME: ${{ steps.full_disk_prepare.outcome }}
          KORA_LIFETIME_CHECKOUT_REVISION: ${{ steps.source_revision.outputs.checkout_revision }}
          KORA_MEASUREMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$FULL_DISK_PREPARE_OUTCOME" = success
          printf 'Actual checkout: %s\nRequested measurement revision: %s\n' "$KORA_LIFETIME_CHECKOUT_REVISION" "$KORA_MEASUREMENT_REVISION" > measurements/conformance-full-disk/source-revision.txt
          uv run --no-sync python -m tests.measurements.lifetime_evidence full-disk "$KORA_LIFETIME_FULL_DISK_ROOT" "$PWD/measurements/conformance-full-disk"
      - name: Dispose captured full-disk mount
        id: full_disk_cleanup
        if: ${{ always() && !cancelled() && steps.full_disk_prepare.outcome != 'skipped' }}
        env:
          FULL_DISK_EVIDENCE_OUTCOME: ${{ steps.full_disk_evidence.outcome }}
        run: |
          test "$FULL_DISK_EVIDENCE_OUTCOME" = success
          test -n "$KORA_LIFETIME_FULL_DISK_ROOT"
          sudo umount "$KORA_LIFETIME_FULL_DISK_ROOT"
          rmdir "$KORA_LIFETIME_FULL_DISK_ROOT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: full_disk_upload
        if: ${{ always() && !cancelled() && steps.full_disk_prepare.outcome != 'skipped' }}
        with:
          name: conformance-full-disk-evidence
          path: measurements/conformance-full-disk
          if-no-files-found: error
      - name: Check the synced environment and unchanged dependency files
        id: final_sync
        if: ${{ always() && !cancelled() }}
        run: |
          uv sync --locked --no-build --group build --extra postgres --extra cel
          git diff --exit-code -- pyproject.toml uv.lock web/package.json \
            web/pnpm-lock.yaml web/pnpm-workspace.yaml
      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: exit 0
      - name: Require every producer step
        id: required_measurements
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_REVISION_OUTCOME: ${{ steps.source_revision.outcome }}
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
          LOGGING_UPLOAD_OUTCOME: ${{ steps.logging_upload.outcome }}
          DATABASE_MEASUREMENT_OUTCOME: ${{ steps.database_measurement.outcome }}
          DATABASE_UPLOAD_OUTCOME: ${{ steps.database_upload.outcome }}
          FULL_DISK_PREPARE_OUTCOME: ${{ steps.full_disk_prepare.outcome }}
          FULL_DISK_OUTCOME: ${{ steps.full_disk.outcome }}
          FULL_DISK_EVIDENCE_OUTCOME: ${{ steps.full_disk_evidence.outcome }}
          FULL_DISK_CLEANUP_OUTCOME: ${{ steps.full_disk_cleanup.outcome }}
          FULL_DISK_UPLOAD_OUTCOME: ${{ steps.full_disk_upload.outcome }}
          FINAL_SYNC_OUTCOME: ${{ steps.final_sync.outcome }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome != 'skipped' }}
        run: |
          test "$DEPENDENCIES_OUTCOME" = success
          test "$SOURCE_REVISION_OUTCOME" = success
          test "$MEASUREMENT_OUTCOME" = success
          test "$LOGGING_UPLOAD_OUTCOME" = success
          test "$DATABASE_MEASUREMENT_OUTCOME" = success
          test "$DATABASE_UPLOAD_OUTCOME" = success
          test "$FULL_DISK_PREPARE_OUTCOME" = success
          test "$FULL_DISK_OUTCOME" = success
          test "$FULL_DISK_EVIDENCE_OUTCOME" = success
          test "$FULL_DISK_CLEANUP_OUTCOME" = success
          test "$FULL_DISK_UPLOAD_OUTCOME" = success
          test "$FINAL_SYNC_OUTCOME" = success
          test "$WORKFLOW_CANCELLED" = false
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

