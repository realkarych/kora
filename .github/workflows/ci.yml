    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.1
          python-version: 3.11.17
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: cel-measurements
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - name: Install locked wheel dependencies
        id: dependencies
        run: uv sync --locked --no-build --group build --extra postgres --extra cel --no-install-project
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - name: Record checked-out revision
        id: source_revision
        run: |
          mkdir -p measurements
          git rev-parse HEAD > measurements/cel-checkout-revision.txt
        if: ${{ needs.change-scope.outputs.full != 'false' }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        id: ir_download
        if: ${{ needs.change-scope.outputs.full != 'false' && (always() && !cancelled()) }}
        with:
          pattern: ir-models-cost-measurement-${{ env.KORA_MEASUREMENT_REVISION }}-*
