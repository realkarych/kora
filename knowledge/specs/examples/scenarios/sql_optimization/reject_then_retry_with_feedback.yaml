graph: sql_optimization
description: The final approval is rejected with a comment; the scenario retries the producing node through the public retry operation, and the new attempt receives the comment.
params: { target_task: daily_revenue }
secrets: { YT_TOKEN: dummy-warehouse-token }
overrides:
  - { select: baseline, exit_code: 0, output: { cpu_seconds: 100.0, output_path: out.json }, reason: needs the warehouse }
  - { select: "candidates[0]/dev_run", exit_code: 0, output: { cpu_seconds: 70.0, output_path: out.json }, reason: needs the warehouse }
  - { select: "candidates[0]/equivalence", exit_code: 0, reason: needs the warehouse }
  - { select: "candidates[0]/dev_run@2", exit_code: 0, output: { cpu_seconds: 60.0, output_path: out.json }, reason: needs the warehouse }
  - { select: "candidates[0]/equivalence@2", exit_code: 0, reason: needs the warehouse }
  - { select: confirm_gain, exit_code: 0, output: { cpu_seconds: 68.0, output_path: out.json }, reason: needs the warehouse }
outcomes:
  - { select: find_target, outputs: { target: { task_id: daily_revenue, query_path: q/daily_revenue.sql } } }
  - { select: hypotheses, outputs: { result: [ { title: push filter down, task_id: daily_revenue } ] } }
  - { select: "candidates[0]/implement", change: { files: { q/daily_revenue.sql: "select 1 -- filtered\n" } }, outputs: { change: { branch: kora/daily-revenue-0 } } }
  - { select: "candidates[0]/review", outputs: { verdict: { approved: true, comments: "" } } }
  - { select: "candidates[0]/implement@2", change: { files: { q/daily_revenue.sql: "select 1 -- filtered, indexed\n" } }, outputs: { change: { branch: kora/daily-revenue-0 } } }
  - { select: "candidates[0]/review@2", outputs: { verdict: { approved: true, comments: "" } } }
  - { select: bundle, outputs: { bundle: { narrative: { summary: filter push-down, rationale: only candidate } } } }
  - { select: bundle@2, outputs: { bundle: { narrative: { summary: filter push-down with index, rationale: addresses review } } } }
actions:
  - { when: { waiting: final_pr }, do: { respond: { decision: rejected, comment: add an index instead of rewriting the join, reviewer: reviewer-1 } } }
  - { when: { settled: true }, do: { retry: { node: "candidates[0]/implement", strategy: fresh_with_feedback } } }
  - { when: { waiting: final_pr }, do: { respond: { decision: approved, reviewer: reviewer-1 } } }
  - { when: { waiting: prestable_rollout }, do: { event: { name: deploy.finished, payload: { commit: "$from: bundle@2.bundle.facts.change.commit" } } } }
expect:
  run: succeeded
  feedback_contains: { "candidates[0]/implement@2": add an index instead of rewriting the join }
  nodes: { final_pr: succeeded }
